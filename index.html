<body>
<div class="app">
  <header><div><div id="date" class="eyebrow"></div><h1 id="title">오늘</h1><div id="brand-mini" class="brand-mini"></div></div><button class="avatar" data-act="goto-me">ME</button></header>
  <main id="main"></main>

<nav id="nav"><button class="active" data-tab="today">●<span>오늘</span></button><button data-tab="calendar">▦<span>캘린더</span></button><button data-tab="future">↗<span>미래</span></button><button data-tab="money">₩<span>돈</span></button><button data-tab="me">◎<span>나</span></button></nav>
<div id="overlay" class="overlay"><section class="sheet"><div class="handle"></div><div id="sheet"></div></section></div>
<div id="toast" class="toast"></div>
<script>'use strict';

/* =========================
   v0.16 data + migration
   ========================= */
const K = 'seungjong_move_v08'; // keep legacy key so existing data survives deployment
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const won = n => Math.round(Number(n)||0).toLocaleString('ko-KR') + '원';
const short = n => (Number(n||0)/10000).toLocaleString('ko-KR',{maximumFractionDigits:1}) + '만';
const esc = (v='') => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = x => JSON.parse(JSON.stringify(x));

let NOW = new Date();
let TODAY = iso(NOW);

const DEFAULT_AREAS = () => [
  {id:'personal', name:'개인', icon:'●', color:'#3182f6', incomeLinked:false},
  {id:'income', name:'수익', icon:'₩', color:'#df5656', incomeLinked:true},
  {id:'growth', name:'성장', icon:'◆', color:'#8b5cf6', incomeLinked:false},
  {id:'work', name:'업무', icon:'■', color:'#16a36a', incomeLinked:false},
  {id:'asset', name:'자산', icon:'▲', color:'#d99a20', incomeLinked:false}
];
const LEGACY_AREAS = () => [
  {id:'personal', name:'개인', icon:'●', color:'#3182f6', incomeLinked:false},
  {id:'income', name:'수익', icon:'₩', color:'#df5656', incomeLinked:true},
  {id:'growth', name:'실력', icon:'◆', color:'#8b5cf6', incomeLinked:false},
  {id:'work', name:'시스템', icon:'■', color:'#16a36a', incomeLinked:false},
  {id:'asset', name:'자산', icon:'▲', color:'#d99a20', incomeLinked:false}
];
const ROLE_MAP = {개인:'personal',수익:'income',실력:'growth',성장:'growth',시스템:'work',업무:'work',자산:'asset'};

function blankSeed(){
  return {
    version:16,
    onboarded:false,
    tab:'today', moneyPage:'main', mePage:'main', calMode:'schedule', month:TODAY.slice(0,7), selected:TODAY,
    profile:{name:'', nickname:'', birthDate:'', appTitle:'움직이자'},
    settings:{focusMinutes:10},
    future:{destination:'', stageTitle:'', stageDescription:''},
    areas:DEFAULT_AREAS(),
    incomeCats:['급여','사업','용돈','투자','기타'],
    expenseCats:['식비','교통','주거','쇼핑','건강','교육','기타'],
    accounts:[], assets:[], debts:[], specialAsset:{enabled:false,label:'장기 자산',value:0,goal:0},
    events:[], tasks:[], manualCores:[], tx:[], goals:[], milestones:[], routines:[], reviews:[], decisions:[],
    principle:'', promise:'', promiseUpdatedAt:'',
    reviewPrompts:{
      weekly:[
        {key:'skill',label:'이번 주에 잘된 점'},
        {key:'system',label:'앞으로도 계속 가져갈 것'},
        {key:'next',label:'다음 주 가장 중요한 것'}
      ],
      monthly:[
        {key:'best',label:'이번 달 가장 잘한 것'},
        {key:'waste',label:'줄이거나 바꾸고 싶은 것'},
        {key:'system',label:'앞으로도 남길 것'},
        {key:'next',label:'다음 달 가장 중요한 것'}
      ]
    },
    decisionPrompts:[
      {key:'skill',label:'이 선택이 나를 성장시키나?',kind:'core'},
      {key:'repeat',label:'장기적으로 반복 가치가 있나?',kind:'core'},
      {key:'cash',label:'최악의 경우에도 감당 가능한가?',kind:'core'},
      {key:'fixed',label:'고정비나 의무가 크게 늘어나나?',kind:'risk'},
      {key:'control',label:'내 통제 밖의 변수가 많은가?',kind:'risk'},
      {key:'emotion',label:'감정 때문에 서두르는 결정인가?',kind:'risk'}
    ]
  };
}

function oldTxEffect(tx, account){
  if(!tx || !account || account.type!=='cash') return 0;
  if(tx.account!==account.id) return 0;
  if(tx.type==='income') return Number(tx.amount)||0;
  if(tx.type==='expense') return -(Number(tx.amount)||0);
  return 0;
}

function migrate(raw, fromImport=false){
  const hadLegacy = raw && typeof raw === 'object' && !raw.version;
  const base = blankSeed();
  const x = raw && typeof raw==='object' ? raw : base;

  // Existing pre-v16 users keep their existing personal prototype data.
  if(hadLegacy){
    x.onboarded = true;
    x.profile = x.profile || {name:'이승종', nickname:'승종', birthDate:'', appTitle:'승종아 움직이자', legacyAge:24};
    x.future = x.future || {
      destination:'일하지 않아도 생활수준이 떨어지지 않는 상태',
      stageTitle:'돈 되는 실력을 만들고 수익을 현금과 자산으로 남기는 시기',
      stageDescription:'지금은 규모보다 반복해서 돈을 만드는 실력과, 번 돈이 실제로 남는 구조를 먼저 만든다.'
    };
    x.areas = x.areas || LEGACY_AREAS();
    x.specialAsset = x.specialAsset || {enabled:true,label:'자유 자산',value:Number(x.free)||0,goal:Number(x.freeGoal)||0};
  }

  x.version = 16;
  x.onboarded = !!x.onboarded;
  x.tab = x.tab || 'today';
  x.moneyPage = x.moneyPage || 'main';
  x.mePage = x.mePage || 'main';
  x.calMode = x.calMode || 'schedule';
  x.month = x.month || TODAY.slice(0,7);
  x.selected = x.selected || TODAY;
  x.profile = {...base.profile, ...(x.profile||{})};
  x.settings = {...base.settings, ...(x.settings||{})};
  x.future = {...base.future, ...(x.future||{})};
  x.areas = Array.isArray(x.areas) && x.areas.length ? x.areas : DEFAULT_AREAS();
  x.areas = x.areas.map((a,i)=>({id:a.id||`area_${i}_${uid()}`,name:a.name||'영역',icon:a.icon||'●',color:a.color||'#3182f6',incomeLinked:!!a.incomeLinked}));
  if(!x.areas.some(a=>a.incomeLinked) && hadLegacy){ const a=x.areas.find(a=>a.id==='income'); if(a)a.incomeLinked=true; }
  x.incomeCats = Array.isArray(x.incomeCats) && x.incomeCats.length ? x.incomeCats : clone(base.incomeCats);
  x.expenseCats = Array.isArray(x.expenseCats) && x.expenseCats.length ? x.expenseCats : clone(base.expenseCats);
  ['accounts','assets','debts','events','tasks','manualCores','tx','goals','milestones','routines','reviews','decisions'].forEach(k=>{ if(!Array.isArray(x[k])) x[k]=[]; });
  x.principle = x.principle || '';
  x.promise = x.promise || '';
  x.promiseUpdatedAt = x.promiseUpdatedAt || '';
  x.specialAsset = {...base.specialAsset, ...(x.specialAsset||{})};
  x.reviewPrompts = x.reviewPrompts || clone(base.reviewPrompts);
  x.reviewPrompts.weekly = Array.isArray(x.reviewPrompts.weekly) ? x.reviewPrompts.weekly : clone(base.reviewPrompts.weekly);
  x.reviewPrompts.monthly = Array.isArray(x.reviewPrompts.monthly) ? x.reviewPrompts.monthly : clone(base.reviewPrompts.monthly);
  x.decisionPrompts = Array.isArray(x.decisionPrompts) && x.decisionPrompts.length ? x.decisionPrompts : clone(base.decisionPrompts);

  // Normalize roles/areas from old Korean string values.
  x.events.forEach(e=>{
    e.area = e.area || ROLE_MAP[e.role] || (x.areas[0]&&x.areas[0].id) || 'personal';
    e.core=!!e.core; e.done=!!e.done;
  });
  x.tasks.forEach(t=>{
    t.area = t.area || ROLE_MAP[t.role] || (x.areas[0]&&x.areas[0].id) || 'personal';
    t.core=!!t.core; t.done=!!t.done;
  });
  x.manualCores.forEach(c=>{c.done=!!c.done;});

  // Convert old mutable balances into opening balances so future edits/deletes remain mathematically reversible.
  x.accounts.forEach(a=>{
    a.type = a.type==='card'?'card':'cash';
    if(a.openingBalance==null){
      const current = Number(a.balance)||0;
      if(a.type==='card'){
        a.openingBalance = current;
        x.tx.filter(t=>t.account===a.id && (t.type==='income'||t.type==='expense')).forEach(t=>t.legacyNoAccountEffect=true);
      }else{
        const effect = x.tx.reduce((s,t)=>s+oldTxEffect(t,a),0);
        a.openingBalance = current - effect;
      }
    }
  });

  x.tx.forEach(t=>{
    t.amount = Number(t.amount)||0;
    t.date = t.date || TODAY;
    t.type = t.type || 'expense';
  });
  x.assets.forEach(a=>a.value=Number(a.value)||0);
  x.debts.forEach(d=>{
    d.principal=Number(d.principal)||0; d.payment=Number(d.payment)||0; d.rate=Number(d.rate)||0;
    if(d.account && !x.accounts.some(a=>a.id===d.account)) d.account = x.accounts.find(a=>a.type==='cash')?.id || '';
  });
  x.goals.forEach(g=>{g.progress=Math.max(0,Math.min(100,Number(g.progress)||0));});
  x.milestones = x.milestones.map(m=>({id:m.id||uid(),age:m.age||'',title:m.title||'',sub:m.sub||''}));
  x.routines = x.routines.map(r=>({id:r.id||uid(),name:r.name||'루틴',days:Array.isArray(r.days)?r.days:[0,1,2,3,4,5,6],completions:r.completions||{},active:r.active!==false}));

  if(!fromImport && hadLegacy && !x.v16Migrated){
    x.v16Migrated = true;
  }
  return x;
}

const rawSaved = localStorage.getItem(K);
let S;
try{ S = rawSaved ? migrate(JSON.parse(rawSaved)) : blankSeed(); }
catch(e){ S = blankSeed(); }

const save = () => { S.accounts.forEach(a=>a.balance=accountBalance(a.id)); localStorage.setItem(K, JSON.stringify(S)); };

/* =========================
   shared calculations
   ========================= */
function area(id){ return S.areas.find(a=>a.id===id) || S.areas[0] || {id:'none',name:'기타',icon:'●',color:'#8b95a1',incomeLinked:false}; }
function areaLabel(id){ const a=area(id); return `${a.icon} ${a.name}`; }
function acc(id){ return S.accounts.find(a=>a.id===id)?.name || '삭제된 계정'; }
function accountObj(id){ return S.accounts.find(a=>a.id===id); }

function txEffectForAccount(t, accountId){
  if(!t || t.legacyNoAccountEffect) return 0;
  const a = accountObj(accountId);
  if(!a) return 0;
  const amt = Number(t.amount)||0;
  if(t.type==='income' && t.account===accountId){ return a.type==='cash' ? amt : 0; }
  if(t.type==='expense' && t.account===accountId){ return a.type==='cash' ? -amt : amt; }
  if(t.type==='adjustment' && t.account===accountId){ return Number(t.adjustment)||0; }
  if(t.type==='transfer'){
    if(t.account===accountId) return a.type==='cash' ? -amt : amt;
    if(t.toAccount===accountId) return a.type==='card' ? -amt : amt;
  }
  return 0;
}
function accountBalance(id){
  const a=accountObj(id); if(!a)return 0;
  return (Number(a.openingBalance)||0) + S.tx.reduce((s,t)=>s+txEffectForAccount(t,id),0);
}
function cash(){ return S.accounts.filter(a=>a.type==='cash').reduce((s,a)=>s+accountBalance(a.id),0); }
function cardDebt(){ return S.accounts.filter(a=>a.type==='card').reduce((s,a)=>s+Math.max(0,accountBalance(a.id)),0); }
function cardCredit(){ return S.accounts.filter(a=>a.type==='card').reduce((s,a)=>s+Math.max(0,-accountBalance(a.id)),0); }
function assetTotal(){ return cash() + cardCredit() + S.assets.reduce((s,a)=>s+(Number(a.value)||0),0); }
function debtTotal(){ return S.debts.reduce((s,d)=>s+(Number(d.principal)||0),0) + cardDebt(); }
function net(){ return assetTotal()-debtTotal(); }
function snapshot(){ return {cash:cash(),assets:assetTotal(),debt:debtTotal(),net:net()}; }
function sum(type,start,end){ return S.tx.filter(t=>t.type===type && (!start||t.date>=start) && (!end||t.date<=end)).reduce((s,t)=>s+(Number(t.amount)||0),0); }
function monthRange(m){ const [y,mo]=m.split('-').map(Number),last=new Date(y,mo,0).getDate(); return [`${y}-${pad(mo)}-01`,`${y}-${pad(mo)}-${pad(last)}`]; }
function weekRange(date=TODAY){ const d=new Date(date+'T00:00:00'),n=(d.getDay()+6)%7,s=new Date(d);s.setDate(d.getDate()-n);const e=new Date(s);e.setDate(s.getDate()+6);return [iso(s),iso(e)]; }
function label(date){ if(!date)return '-'; const [y,m,d]=date.split('-').map(Number),x=new Date(y,m-1,d);return `${m}월 ${d}일 ${['일','월','화','수','목','금','토'][x.getDay()]}요일`; }
function ageNow(){
  const b=S.profile.birthDate;
  if(!b) return S.profile.legacyAge ? `${S.profile.legacyAge}세` : '나이 설정 필요';
  const bd=new Date(b+'T00:00:00'); if(Number.isNaN(bd.getTime()))return '나이 설정 필요';
  let age=NOW.getFullYear()-bd.getFullYear();
  const hadBirthday = (NOW.getMonth()>bd.getMonth()) || (NOW.getMonth()===bd.getMonth() && NOW.getDate()>=bd.getDate());
  if(!hadBirthday)age--;
  return `${Math.max(0,age)}세`;
}
function initials(){
  const v=(S.profile.nickname||S.profile.name||'ME').trim();
  if(!v)return 'ME';
  if(/[가-힣]/.test(v)) return v.slice(-2).toUpperCase();
  return v.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
}
function topCat(type,s,e){ const m={}; S.tx.filter(t=>t.type===type&&t.date>=s&&t.date<=e).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount); return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]||['없음',0]; }
function goalAverage(){ return S.goals.length?Math.round(S.goals.reduce((s,g)=>s+(Number(g.progress)||0),0)/S.goals.length):0; }
function coreItems(date=TODAY){
  return [
    ...S.events.filter(x=>x.date===date&&x.core&&!x.done).map(x=>({...x,type:'event',time:x.time||''})),
    ...S.tasks.filter(x=>x.date===date&&x.core&&!x.done).map(x=>({...x,type:'task',time:''})),
    ...S.manualCores.filter(x=>x.date===date&&!x.done).map(x=>({...x,type:'manual',time:''}))
  ].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
}
function coreHistory(start,end){
  const e=S.events.filter(x=>x.date>=start&&x.date<=end&&(x.core||x.coreCompleted));
  const t=S.tasks.filter(x=>x.date>=start&&x.date<=end&&(x.core||x.coreCompleted));
  const m=S.manualCores.filter(x=>x.date>=start&&x.date<=end);
  const total=e.length+t.length+m.length;
  const done=e.filter(x=>x.done||x.coreCompleted).length+t.filter(x=>x.done||x.coreCompleted).length+m.filter(x=>x.done).length;
  return {total,done,pct:total?Math.round(done/total*100):0};
}
function nextEventToday(){ const now=`${pad(NOW.getHours())}:${pad(NOW.getMinutes())}`; const ev=S.events.filter(x=>x.date===TODAY&&!x.done).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')); return ev.find(x=>(x.time||'99:99')>=now)||ev[0]||null; }

/* =========================
   UI helpers
   ========================= */
let undoAction=null, toastTimer=null, timer=null, remain=600;
function toast(text, undoFn=null){
  const el=document.querySelector('#toast'); if(!el)return;
  undoAction=undoFn;
  el.innerHTML=`<span>${esc(text)}</span>${undoFn?'<button data-undo>되돌리기</button>':''}`;
  el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.classList.remove('show');undoAction=null;},2400);
}
function open(html){ document.querySelector('#sheet').innerHTML=html; document.querySelector('#overlay').classList.add('open'); }
function close(){ stopTimer(); document.querySelector('#overlay').classList.remove('open'); }
function stopTimer(){ if(timer){clearInterval(timer);timer=null;} }
function timerText(){ const e=document.querySelector('#timer');if(e)e.textContent=`${pad(Math.floor(remain/60))}:${pad(remain%60)}`; }
function updateHeader(){
  document.querySelector('#date').textContent=`${NOW.getMonth()+1}월 ${NOW.getDate()}일 ${['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][NOW.getDay()]}`;
  const av=document.querySelector('.avatar');if(av)av.textContent=initials();
  const brand=document.querySelector('#brand-mini');if(brand)brand.textContent=S.profile.appTitle||'움직이자';
  document.title=`${S.profile.appTitle||'움직이자'} v0.16`;
}
function refreshToday(force=false){
  const n=new Date(), next=iso(n),changed=next!==TODAY; NOW=n;
  if(changed){ TODAY=next; if(S.selected && S.selected<TODAY) S.selected=TODAY; S.month=TODAY.slice(0,7); }
  updateHeader();
  if((changed||force) && S.onboarded) render();
}

/* =========================
   onboarding + main render
   ========================= */
function onboardingView(){
  document.querySelector('#title').textContent='시작하기';
  document.querySelector('#nav').classList.add('hidden');
  document.querySelector('#fab').classList.add('hidden');
  document.querySelector('#main').innerHTML=`
    <div class="onboarding">
      <div class="welcome">내 삶을 내가<br>운영하는 공간</div>
      <div class="welcome-sub">처음부터 복잡하게 채울 필요 없어요. 이름과 첫 계좌만 설정하고, 나머지는 쓰면서 직접 추가·수정·삭제할 수 있어요.</div>
      <div class="card onboarding-card">
        <div class="section-title">내 프로필</div>
        <div class="field">이름</div><input id="obname" class="input" placeholder="예: 김민수">
        <div class="field">앱에서 부를 이름</div><input id="obnick" class="input" placeholder="예: 민수">
        <div class="field">생년월일</div><input id="obbirth" class="input" type="date">
        <div class="field">앱 이름</div><input id="obtitle" class="input" value="움직이자" placeholder="예: 민수야 움직이자">
      </div>
      <div class="card">
        <div class="section-title">첫 현금 계정</div>
        <div class="field">계정 이름</div><input id="obacc" class="input" placeholder="예: 주거래 계좌" value="기본 계좌">
        <div class="field">현재 잔액</div><input id="obbal" class="amount" type="number" value="0" inputmode="numeric">
        <button class="primary" data-save-onboarding>시작하기</button>
      </div>
    </div>`;
}

function render(){
  updateHeader();
  if(!S.onboarded){ onboardingView(); return; }
  document.querySelector('#nav').classList.remove('hidden');
  document.querySelector('#fab').classList.remove('hidden');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.tab));
  document.querySelector('#title').textContent={today:'오늘',calendar:'캘린더',future:'미래',money:'돈',me:'나'}[S.tab]||'오늘';
  if(S.tab==='today') todayView();
  else if(S.tab==='calendar') calendarView();
  else if(S.tab==='future') futureView();
  else if(S.tab==='money') moneyView();
  else meView();
  save();
}

/* =========================
   Today + routines
   ========================= */
function routineScheduled(r,date){ const d=new Date(date+'T00:00:00'); return r.active!==false && r.days.includes(d.getDay()); }
function routineDone(r,date){ return !!(r.completions&&r.completions[date]); }
function routineStreak(r){
  let d=new Date(TODAY+'T00:00:00'),streak=0,guard=0;
  while(guard++<90){ const date=iso(d); if(routineScheduled(r,date)){ if(routineDone(r,date))streak++; else if(date!==TODAY)break; else if(!routineDone(r,date))break; } d.setDate(d.getDate()-1); }
  return streak;
}
function routineMonthRate(r){

function calendarView(){

/* =========================
   Reviews + decisions
   ========================= */
function reviewField(p,value=''){ return `<div class="field">${esc(p.label)}</div><textarea class="textarea review-answer" data-key="${esc(p.key)}">${esc(value||'')}</textarea>`; }
function weekly(existing=null){ const [s,e]=weekRange(existing?.date||TODAY),sn=existing||snapshot();open(`<h2>${existing?'주간 리뷰 수정':'이번 주 리뷰'}</h2><div class="item"><span>수익</span><b class="pos">+${won(existing?.income??sum('income',s,e))}</b></div><div class="item"><span>지출</span><b class="neg">-${won(existing?.expense??sum('expense',s,e))}</b></div><div class="item"><span>${existing?'작성 당시':'작성 시점'} 순자산</span><b>${won(existing?.net??sn.net)}</b></div>${S.reviewPrompts.weekly.map(p=>reviewField(p,existing?.[p.key])).join('')}<button class="primary" ${existing?`data-save-review-edit="${existing.id}"`:'data-save-review="weekly"'}>저장</button>${existing?`<button class="delete-btn" data-delete-review="${existing.id}">리뷰 삭제</button>`:''}`); }
function monthly(existing=null){ const date=existing?.date||TODAY,[s,e]=monthRange(date.slice(0,7)),sn=existing||snapshot(),i=topCat('income',s,e),o=topCat('expense',s,e);open(`<h2>${existing?'월간 리뷰 수정':`${Number(date.slice(5,7))}월 리뷰`}</h2><div class="item"><span>수익</span><b class="pos">+${won(existing?.income??sum('income',s,e))}</b></div><div class="item"><span>지출</span><b class="neg">-${won(existing?.expense??sum('expense',s,e))}</b></div>${!existing?`<div class="item"><span>가장 큰 수익원</span><b>${esc(i[0])} · ${won(i[1])}</b></div><div class="item"><span>가장 큰 지출</span><b>${esc(o[0])} · ${won(o[1])}</b></div>`:''}<div class="item"><span>${existing?'작성 당시':'작성 시점'} 순자산</span><b>${won(existing?.net??sn.net)}</b></div>${S.reviewPrompts.monthly.map(p=>reviewField(p,existing?.[p.key])).join('')}<button class="primary" ${existing?`data-save-review-edit="${existing.id}"`:'data-save-review="monthly"'}>저장</button>${existing?`<button class="delete-btn" data-delete-review="${existing.id}">리뷰 삭제</button>`:''}`); }
function reviewHistory(){ open(`<h2>지난 리뷰</h2>${S.reviews.slice().reverse().map(x=>`<button class="review" data-review="${x.id}"><span class="tag">${x.type==='monthly'?'월간':'주간'}</span><b>${esc(x.next||x.skill||x.best||'리뷰')}</b><div class="sub">${x.date} · 당시 순자산 ${won(x.net)}</div></button>`).join('')||'<div class="muted">아직 기록이 없어요.</div>'}`); }
function reviewDetail(id){ const x=S.reviews.find(r=>r.id===id);if(!x)return;const prompts=x.type==='monthly'?S.reviewPrompts.monthly:S.reviewPrompts.weekly;open(`<h2>${x.type==='monthly'?'월간':'주간'} 리뷰 상세</h2><div class="item"><span>수익</span><b class="pos">+${won(x.income)}</b></div><div class="item"><span>지출</span><b class="neg">-${won(x.expense)}</b></div><div class="item"><span>작성 시점 현금</span><b>${won(x.cash)}</b></div><div class="item"><span>작성 시점 총자산</span><b>${won(x.assets)}</b></div><div class="item"><span>작성 시점 부채</span><b>${won(x.debt)}</b></div><div class="item"><span>작성 시점 순자산</span><b>${won(x.net)}</b></div>${prompts.map(p=>`<div class="field">${esc(p.label)}</div><div class="explain">${esc(x[p.key]||'없음')}</div>`).join('')}<button class="primary" data-edit-review="${x.id}">리뷰 수정</button><button class="delete-btn" data-delete-review="${x.id}">리뷰 삭제</button>`); }
function decision(existing=null){ const sn=existing||snapshot(),answers=existing?.answers||{};open(`<h2>${existing?'큰 결정 수정':'큰 결정 체크'}</h2><div class="field">결정 이름</div><input id="dtitle" class="input" value="${esc(existing?.title||'')}"><div class="field">초기 투입금</div><input id="dcost" class="input" type="number" value="${existing?.cost||''}"><div class="field">월 고정비 증가</div><input id="dfixed" class="input" type="number" value="${existing?.fixed||''}"><div class="item"><span>${existing?'당시':'현재'} 현금</span><b>${won(existing?.cash??sn.cash)}</b></div><div class="item"><span>${existing?'당시':'현재'} 순자산</span><b>${won(existing?.net??sn.net)}</b></div>${S.decisionPrompts.map(p=>`<label class="switchrow"><span>${esc(p.label)}</span><input class="dec" data-key="${p.key}" type="checkbox" ${answers[p.key]?'checked':''}></label>`).join('')}<div class="field">메모</div><textarea id="dmemo" class="textarea">${esc(existing?.memo||'')}</textarea><button class="primary" ${existing?`data-save-decision-edit="${existing.id}"`:'data-save-decision'}>판정하고 저장</button>${existing?`<button class="delete-btn" data-delete-decision="${existing.id}">결정 기록 삭제</button>`:''}`); }
function verdictFromAnswers(ans){ const core=S.decisionPrompts.filter(p=>p.kind==='core'),risk=S.decisionPrompts.filter(p=>p.kind==='risk'),coreYes=core.filter(p=>ans[p.key]).length,riskYes=risk.filter(p=>ans[p.key]).length;let verdict='기록용';if(core.length)verdict=coreYes===core.length&&riskYes<=Math.max(1,Math.floor(risk.length/3))?'검토 가치 높음':coreYes<core.length?'지금은 보류 권장':'한 번 더 검토 권장';return {core:coreYes,risk:riskYes,verdict}; }
function decisionHistory(){ open(`<h2>결정 기록</h2>${S.decisions.slice().reverse().map(x=>`<button class="review" data-decision="${x.id}"><span class="tag">${esc(x.verdict)}</span><b>${esc(x.title)}</b><div class="sub">핵심 ${x.core||0} · 위험 ${x.risk||0} · 당시 순자산 ${won(x.net)}</div></button>`).join('')||'<div class="muted">아직 기록이 없어요.</div>'}`); }
function decisionDetail(id){ const x=S.decisions.find(d=>d.id===id);if(!x)return;open(`<h2>${esc(x.verdict)}</h2><div class="hero-title">${esc(x.title)}</div><div class="item"><span>초기 투입금</span><b>${won(x.cost)}</b></div><div class="item"><span>월 고정비 증가</span><b>${won(x.fixed)}</b></div><div class="item"><span>당시 현금</span><b>${won(x.cash)}</b></div><div class="item"><span>당시 순자산</span><b>${won(x.net)}</b></div><div class="field">메모</div><div class="explain">${esc(x.memo||'없음')}</div><button class="primary" data-edit-decision="${x.id}">기록 수정</button><button class="delete-btn" data-delete-decision="${x.id}">기록 삭제</button>`); }

function routineManager(){ open(`<h2>루틴 관리</h2><div class="explain">매일 또는 특정 요일에 반복할 행동을 정하고 오늘 화면에서 체크해요.</div>${S.routines.map(r=>`<div class="manage-row"><button data-edit-routine="${r.id}" style="text-align:left"><b>${esc(r.name)}</b><div class="sub">${r.days.length===7?'매일':r.days.map(d=>['일','월','화','수','목','금','토'][d]).join('·')} · 이번 달 ${routineMonthRate(r)}%</div></button><button class="mini-btn danger" data-delete-routine="${r.id}">삭제</button></div>`).join('')||'<div class="empty-subtle">아직 루틴이 없어요.</div>'}<button class="secondary" data-add-routine>+ 루틴 추가</button>`); }
function routineForm(r=null){ const days=r?.days||[0,1,2,3,4,5,6];open(`<h2>${r?'루틴 수정':'루틴 추가'}</h2><div class="field">루틴 이름</div><input id="routinename" class="input" value="${esc(r?.name||'')}" placeholder="예: 운동 20분"><div class="field">반복 요일</div><div class="day-pill-row">${['일','월','화','수','목','금','토'].map((x,i)=>`<button class="day-pill ${days.includes(i)?'active':''}" data-routine-day="${i}">${x}</button>`).join('')}</div><button class="primary" ${r?`data-save-routine="${r.id}"`:'data-save-routine="new"'}>저장</button>${r?`<button class="delete-btn" data-delete-routine="${r.id}">루틴 삭제</button>`:''}`); }

function reviewPromptRow(type,p){ return `<div class="manage-row" data-review-prompt-row data-type="${type}" data-key="${p.key||uid()}"><input class="input review-prompt-input" value="${esc(p.label||'')}" placeholder="질문"><div class="manage-actions"><button class="mini-btn" data-prompt-move="up">↑</button><button class="mini-btn" data-prompt-move="down">↓</button><button class="mini-btn danger" data-remove-prompt-row>삭제</button></div></div>`; }
function reviewPromptSetting(){ open(`<h2>리뷰 질문 관리</h2><div class="explain">주간·월간 질문도 개수 제한 없이 추가·수정·삭제·순서변경할 수 있어요.</div><div class="field">주간 리뷰</div><div id="weekly-prompt-list">${S.reviewPrompts.weekly.map(p=>reviewPromptRow('weekly',p)).join('')}</div><button class="secondary" data-add-review-prompt="weekly">+ 주간 질문 추가</button><div class="field">월간 리뷰</div><div id="monthly-prompt-list">${S.reviewPrompts.monthly.map(p=>reviewPromptRow('monthly',p)).join('')}</div><button class="secondary" data-add-review-prompt="monthly">+ 월간 질문 추가</button><button class="primary" data-save-review-prompts>저장</button>`); }
function decisionPromptRow(p){ return `<div class="milestone-edit-row" data-decision-prompt-row data-key="${p.key||uid()}"><div class="inline"><input class="input decision-prompt-input" value="${esc(p.label||'')}" placeholder="판단 질문"><select class="select decision-prompt-kind"><option value="core" ${p.kind==='core'?'selected':''}>핵심 기준</option><option value="risk" ${p.kind==='risk'?'selected':''}>위험 신호</option></select></div><div class="manage-actions" style="justify-content:flex-end;margin-top:6px"><button class="mini-btn" data-prompt-move="up">↑</button><button class="mini-btn" data-prompt-move="down">↓</button><button class="mini-btn danger" data-remove-prompt-row>삭제</button></div></div>`; }
function decisionPromptSetting(){ open(`<h2>큰 결정 질문 관리</h2><div class="explain">판단 질문과 핵심/위험 구분을 모두 직접 구성할 수 있어요.</div><div id="decision-prompt-list">${S.decisionPrompts.map(decisionPromptRow).join('')}</div><button class="secondary" data-add-decision-prompt>+ 질문 추가</button><button class="primary" data-save-decision-prompts>저장</button>`); }
function dataManage(){ open(`<h2>데이터 관리</h2><div class="explain">현재 버전은 기기 브라우저에 저장돼요. 클라우드 연결 전에는 백업 파일을 정기적으로 보관하는 게 안전해요.</div><button class="primary" data-export-data>백업 파일 내보내기</button><button class="secondary" data-import-click>백업 불러오기</button><input id="importfile" class="file-input" type="file" accept="application/json,.json"><div class="card danger-zone" style="margin-bottom:0"><div class="section-title">전체 초기화</div><div class="tiny">모든 일정·돈·목표·설정을 삭제하고 새 사용자 상태로 돌아갑니다.</div><button class="delete-btn" data-reset-data>전체 데이터 초기화</button></div>`); }

/* =========================
   Add forms for account/debt/asset
   ========================= */
function accountAdd(){ open(`<h2>계정 추가</h2><div class="field">계정 이름</div><input id="newaccname" class="input" placeholder="예: 주거래 계좌"><div class="field">종류</div><select id="newacctype" class="select"><option value="cash">현금 계정</option><option value="card">카드</option></select><div class="field">현재 금액</div><input id="newaccbal" class="amount" type="number" value="0"><button class="primary" data-save-new-account>저장</button>`); }
function assetAdd(){ open(`<h2>자산 추가</h2><div class="field">자산 이름</div><input id="an" class="input" placeholder="예: 주식"><div class="field">현재 가치</div><input id="av" class="amount" type="number" placeholder="0"><button class="primary" data-save-asset>저장</button>`); }
function debtAdd(){ const cashAcc=S.accounts.filter(a=>a.type==='cash');open(`<h2>부채 추가</h2><div class="field">이름</div><input id="dn" class="input" placeholder="예: 학자금 대출"><div class="field">남은 원금</div><input id="dp" class="amount" type="number" placeholder="0"><div class="field">금리 %</div><input id="dr" class="input" type="number" step=".01" value="0"><div class="field">월 납부액</div><input id="dpm" class="input" type="number" placeholder="0"><div class="field">납부일</div><input id="dd" class="input" type="number" placeholder="예: 25"><div class="field">납부 계정</div><select id="da" class="select"><option value="">선택 안 함</option>${cashAcc.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><button class="primary" data-save-new-debt>저장</button>`); }

/* =========================
   Event delegation — navigation/opening
   ========================= */
document.querySelector('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;if(S.tab==='me')S.mePage='main';render();});
document.querySelector('#fab').addEventListener('click',()=>quick(TODAY));
document.querySelector('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')close();});

document.addEventListener('click',e=>{
  const undo=e.target.closest('[data-undo]');if(undo&&undoAction){const fn=undoAction;undoAction=null;fn();document.querySelector('#toast').classList.remove('show');return;}
  const mp=e.target.closest('[data-money-page]');if(mp){S.moneyPage=mp.dataset.moneyPage;return render();}
  const tm=e.target.closest('[data-today-money]');if(tm)return todayMoneyDetail(TODAY,tm.dataset.todayMoney);
  const dm=e.target.closest('[data-day-money-detail]');if(dm)return todayMoneyDetail(dm.dataset.date,dm.dataset.dayMoneyDetail);
  const td=e.target.closest('[data-tx-detail]');if(td)return txDetail(td.dataset.txDetail);
  const d=e.target.closest('.day[data-date]');if(d)return dayView(d.dataset.date);
  const mode=e.target.closest('[data-mode]');if(mode){S.calMode=mode.dataset.mode;return render();}
  const md=e.target.closest('[data-month]');if(md){let[y,m]=S.month.split('-').map(Number);m+=Number(md.dataset.month);if(m<1){m=12;y--;}if(m>12){m=1;y++;}S.month=`${y}-${pad(m)}`;return render();}
  const q=e.target.closest('[data-quick]');if(q){const date=document.querySelector('#qdate')?.value||TODAY;if(['income','expense'].includes(q.dataset.quick))return txForm(q.dataset.quick,date);if(q.dataset.quick==='event')return eventForm(date);return taskForm(date);}
  const da=e.target.closest('[data-day-add]');if(da){if(da.dataset.dayAdd==='event')return eventForm(da.dataset.date);if(da.dataset.dayAdd==='task')return taskForm(da.dataset.date);return open(`<h2>${label(da.dataset.date)} 돈 추가</h2><button class="item" data-money-choice="income" data-date="${da.dataset.date}">수익 <b>›</b></button><button class="item" data-money-choice="expense" data-date="${da.dataset.date}">지출 <b>›</b></button>`);}
  const mc=e.target.closest('[data-money-choice]');if(mc)return txForm(mc.dataset.moneyChoice,mc.dataset.date);
  const cat=e.target.closest('[data-cat-val]');if(cat){cat.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));cat.classList.add('active');return;}
  const ap=e.target.closest('[data-acc-val]');if(ap){ap.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));ap.classList.add('active');return;}
  const ar=e.target.closest('[data-area-val]');if(ar){ar.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));ar.classList.add('active');if(ar.parentElement.id==='roles'){const panel=document.querySelector('#incomePanel');if(panel)panel.style.display=area(ar.dataset.areaVal).incomeLinked?'block':'none';}return;}
  const core=e.target.closest('[data-core]');if(core){const col=core.dataset.core==='event'?S.events:S.tasks,x=col.find(z=>z.id===core.dataset.id);if(x){x.core=!x.core;save();render();return coreManager(core.dataset.date);}return;}
  const tog=e.target.closest('[data-toggle]');if(tog){const col=tog.dataset.toggle==='event'?S.events:S.tasks,x=col.find(z=>z.id===tog.dataset.id);if(!x)return;const before={done:x.done,core:x.core,coreCompleted:x.coreCompleted};x.done=!x.done;if(x.done&&x.core){x.coreCompleted=true;x.core=false;}save();render();toast(x.done?'완료했어요':'완료를 취소했어요',()=>{Object.assign(x,before);save();render();});return;}
  const mt=e.target.closest('[data-manual-toggle]');if(mt){const x=S.manualCores.find(z=>z.id===mt.dataset.manualToggle);if(!x)return;x.done=true;save();render();toast('완료했어요',()=>{x.done=false;save();render();});return;}
  const rt=e.target.closest('[data-routine-toggle]');if(rt){const r=S.routines.find(x=>x.id===rt.dataset.routineToggle);if(!r)return;const before=!!r.completions[TODAY];r.completions[TODAY]=!before;if(!r.completions[TODAY])delete r.completions[TODAY];save();render();toast(r.completions[TODAY]?'루틴 완료':'완료 취소',()=>{if(before)r.completions[TODAY]=true;else delete r.completions[TODAY];save();render();});return;}
  const taskD=e.target.closest('[data-task-detail]');if(taskD)return taskDetail(taskD.dataset.taskDetail);
  const ev=e.target.closest('[data-event]');if(ev)return eventDetail(ev.dataset.event);
  const editEv=e.target.closest('[data-edit-event]');if(editEv)return eventForm(S.events.find(x=>x.id===editEv.dataset.editEvent)?.date||TODAY,S.events.find(x=>x.id===editEv.dataset.editEvent));
  const editTask=e.target.closest('[data-edit-task]');if(editTask){const t=S.tasks.find(x=>x.id===editTask.dataset.editTask);if(t)return taskForm(t.date,t);}
  const editTx=e.target.closest('[data-edit-tx]');if(editTx){const t=S.tx.find(x=>x.id===editTx.dataset.editTx);if(t)return txForm(t.type,t.date,t);}
  const db=e.target.closest('[data-debt]');if(db)return debtDetail(db.dataset.debt);
  const de=e.target.closest('[data-debt-edit]');if(de)return debtEdit(de.dataset.debtEdit);
  const as=e.target.closest('[data-asset]');if(as)return assetDetail(as.dataset.asset);
  const ase=e.target.closest('[data-asset-edit]');if(ase)return assetEdit(ase.dataset.assetEdit);
  const ac=e.target.closest('[data-account-asset]');if(ac)return accountDetail(ac.dataset.accountAsset);
  const ae=e.target.closest('[data-account-edit]');if(ae)return accountEdit(ae.dataset.accountEdit);
  const cp=e.target.closest('[data-card-pay]');if(cp)return cardPaymentForm(cp.dataset.cardPay);
  const gl=e.target.closest('[data-goal]');if(gl){const g=S.goals.find(x=>x.id===gl.dataset.goal);if(g)return goalForm(g);}
  const rv=e.target.closest('[data-review]');if(rv)return reviewDetail(rv.dataset.review);
  const er=e.target.closest('[data-edit-review]');if(er){const r=S.reviews.find(x=>x.id===er.dataset.editReview);if(r)return r.type==='monthly'?monthly(r):weekly(r);}
  const dv=e.target.closest('[data-decision]');if(dv)return decisionDetail(dv.dataset.decision);
  const edv=e.target.closest('[data-edit-decision]');if(edv){const d=S.decisions.find(x=>x.id===edv.dataset.editDecision);if(d)return decision(d);}
  const era=e.target.closest('[data-edit-area]');if(era)return areaEdit(era.dataset.editArea);
  const rr=e.target.closest('[data-edit-routine]');if(rr){const r=S.routines.find(x=>x.id===rr.dataset.editRoutine);if(r)return routineForm(r);}
  const rd=e.target.closest('[data-routine-day]');if(rd){rd.classList.toggle('active');return;}

  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='goto-me'){S.tab='me';S.mePage='main';return render();}
  if(act==='promise-page'){S.tab='me';S.mePage='promise';return render();}
  if(act==='promise-back'){S.mePage='main';return render();}
  if(act==='goto-money'){S.tab='money';S.moneyPage='main';return render();}
  if(act==='goto-future'){S.tab='future';return render();}
  if(act==='quick-money')return open(`<h2>돈 추가</h2><button class="item" data-money-choice="income" data-date="${TODAY}"><span>＋ 수익</span><b>›</b></button><button class="item" data-money-choice="expense" data-date="${TODAY}"><span>− 지출</span><b>›</b></button>`);
  if(act==='focus')return focus();
  if(act==='core')return coreManager(TODAY);
  if(act==='core-date')return coreManager(a.dataset.date);
  if(act==='today-cal'){S.tab='calendar';S.selected=TODAY;return render();}
  if(act==='goal-add')return goalForm();
  if(act==='milestones')return milestoneEditor();
  if(act==='future-edit')return futureEdit();
  if(act==='weekly')return weekly();
  if(act==='monthly')return monthly();
  if(act==='review-history')return reviewHistory();
  if(act==='decision')return decision();
  if(act==='decision-history')return decisionHistory();
  if(act==='profile-edit')return profileEdit();
  if(act==='area-manage')return areaManager();
  if(act==='category-manage')return categoryManager();
  if(act==='routine-manage')return routineManager();
  if(act==='timer-setting')return timerSetting();
  if(act==='special-asset')return specialAssetEdit();
  if(act==='review-prompt-setting')return reviewPromptSetting();
  if(act==='decision-prompt-setting')return decisionPromptSetting();
  if(act==='data-manage')return dataManage();
  if(act==='principle')return open(`<h2>내 원칙</h2><textarea id="principle" class="textarea">${esc(S.principle)}</textarea><button class="primary" data-save-principle>저장</button>`);
  if(act==='promise')return open(`<h2>나에게 한 약속</h2><textarea id="promise" class="textarea">${esc(S.promise)}</textarea><button class="primary" data-save-promise>저장</button>`);
  if(act==='account-add')return accountAdd();
  if(act==='asset-add')return assetAdd();
  if(act==='debt-add')return debtAdd();
  if(act==='tx-history'){S.moneyPage='ledger';S.tab='money';return render();}
  if(act==='timer-start'){stopTimer();timer=setInterval(()=>{remain=Math.max(0,remain-1);timerText();if(remain<=0){stopTimer();toast(`${S.settings.focusMinutes}분 집중 완료`);}},1000);return;}
  if(act==='timer-pause'){stopTimer();return;}
  if(act==='timer-reset'){stopTimer();remain=Math.max(1,Number(S.settings.focusMinutes)||10)*60;return timerText();}
});

/* =========================
   Saving/CRUD actions
   ========================= */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-save-onboarding]')){
    const name=document.querySelector('#obname').value.trim(),nick=document.querySelector('#obnick').value.trim(),accName=document.querySelector('#obacc').value.trim();
    if(!name&&!nick)return toast('이름이나 부를 이름을 입력해줘');
    S.profile={name,nickname:nick||name,birthDate:document.querySelector('#obbirth').value,appTitle:document.querySelector('#obtitle').value.trim()||'움직이자'};
    S.accounts=[{id:uid(),name:accName||'기본 계좌',type:'cash',openingBalance:Number(document.querySelector('#obbal').value)||0}];
    S.onboarded=true;save();return render();
  }
  const st=e.target.closest('[data-save-tx]');if(st){const amount=Number(document.querySelector('#amt').value);if(!amount)return toast('금액을 입력해줘');const cat=document.querySelector('#cats .active')?.dataset.catVal,account=document.querySelector('#accs .active')?.dataset.accVal;if(!cat||!account)return toast('분류와 계정을 선택해줘');S.tx.push({id:uid(),date:document.querySelector('#txdate').value,type:st.dataset.saveTx,amount,cat,account,note:document.querySelector('#note').value.trim()});save();close();render();return toast('저장했어요');}
  const ste=e.target.closest('[data-save-tx-edit]');if(ste){const t=S.tx.find(x=>x.id===ste.dataset.saveTxEdit);if(!t)return;const amount=Number(document.querySelector('#amt').value);if(!amount)return toast('금액을 입력해줘');t.date=document.querySelector('#txdate').value;t.amount=amount;t.cat=document.querySelector('#cats .active')?.dataset.catVal||t.cat;t.account=document.querySelector('#accs .active')?.dataset.accVal||t.account;t.note=document.querySelector('#note').value.trim();delete t.legacyNoAccountEffect;save();close();render();return toast('거래를 수정했어요');}
  if(e.target.closest('[data-save-event]')) return saveEvent(null);
  const see=e.target.closest('[data-save-event-edit]');if(see)return saveEvent(see.dataset.saveEventEdit);
  if(e.target.closest('[data-save-task]')) return saveTask(null);
  const set=e.target.closest('[data-save-task-edit]');if(set)return saveTask(set.dataset.saveTaskEdit);
  const gp=e.target.closest('[data-save-goal]');if(gp){const title=document.querySelector('#gtitle').value.trim();if(!title)return toast('목표를 입력해줘');S.goals.push({id:uid(),level:document.querySelector('#glevel').value.trim()||'기간 미정',title,progress:Math.max(0,Math.min(100,Number(document.querySelector('#gprogress').value)||0))});save();close();render();return toast('목표를 저장했어요');}
  const ge=e.target.closest('[data-save-goal-edit]');if(ge){const g=S.goals.find(x=>x.id===ge.dataset.saveGoalEdit);if(!g)return;const title=document.querySelector('#gtitle').value.trim();if(!title)return toast('목표를 입력해줘');g.level=document.querySelector('#glevel').value.trim()||'기간 미정';g.title=title;g.progress=Math.max(0,Math.min(100,Number(document.querySelector('#gprogress').value)||0));save();close();render();return toast('목표를 수정했어요');}
  if(e.target.closest('[data-save-milestones]')){S.milestones=[...document.querySelectorAll('[data-ms-row]')].map(r=>({id:r.dataset.id||uid(),age:r.querySelector('.msage').value.trim(),title:r.querySelector('.mstitle').value.trim(),sub:r.querySelector('.mssub').value.trim()})).filter(x=>x.age||x.title||x.sub);save();close();render();return toast('이정표를 저장했어요');}
  if(e.target.closest('[data-save-future]')){S.future.destination=document.querySelector('#fdest').value.trim();S.future.stageTitle=document.querySelector('#fstage').value.trim();S.future.stageDescription=document.querySelector('#fdesc').value.trim();save();close();render();return toast('미래 방향을 저장했어요');}
  const sr=e.target.closest('[data-save-review]');if(sr){const sn=snapshot(),answers={};document.querySelectorAll('.review-answer').forEach(x=>answers[x.dataset.key]=x.value);if(sr.dataset.saveReview==='weekly'){const [s,en]=weekRange();S.reviews.push({id:uid(),type:'weekly',date:TODAY,income:sum('income',s,en),expense:sum('expense',s,en),...sn,...answers});}else{const [s,en]=monthRange(TODAY.slice(0,7));S.reviews.push({id:uid(),type:'monthly',date:TODAY,income:sum('income',s,en),expense:sum('expense',s,en),...sn,...answers});}save();close();render();return toast('리뷰를 저장했어요');}
  const sre=e.target.closest('[data-save-review-edit]');if(sre){const r=S.reviews.find(x=>x.id===sre.dataset.saveReviewEdit);if(!r)return;document.querySelectorAll('.review-answer').forEach(x=>r[x.dataset.key]=x.value);save();close();render();return toast('리뷰를 수정했어요');}
  if(e.target.closest('[data-save-decision]'))return saveDecision(null);
  const sde=e.target.closest('[data-save-decision-edit]');if(sde)return saveDecision(sde.dataset.saveDecisionEdit);
  const ds=e.target.closest('[data-debt-save]');if(ds){const x=S.debts.find(d=>d.id===ds.dataset.debtSave);if(!x)return;x.name=document.querySelector('#edname').value.trim()||x.name;x.principal=Number(document.querySelector('#edprincipal').value)||0;x.rate=Number(document.querySelector('#edrate').value)||0;x.payment=Number(document.querySelector('#edpayment').value)||0;x.due=Number(document.querySelector('#eddue').value)||null;x.account=document.querySelector('#edaccount')?.value||'';save();close();render();return toast('부채를 수정했어요');}
  const pay=e.target.closest('[data-debt-pay]');if(pay){const x=S.debts.find(d=>d.id===pay.dataset.debtPay);if(!x||!x.payment)return toast('월 납부액을 먼저 설정해줘');if(!x.account||!accountObj(x.account))return toast('납부 계정을 먼저 설정해줘');const interest=Math.min(x.payment,Math.round(x.principal*(x.rate||0)/100/12)),principal=Math.min(x.principal,Math.max(0,x.payment-interest)),amount=principal+interest;x.principal=Math.max(0,x.principal-principal);S.tx.push({id:uid(),date:TODAY,type:'expense',amount,cat:'부채 상환',account:x.account,note:`${x.name} · 원금 ${won(principal)} / 이자 ${won(interest)}`,debtId:x.id,principalPaid:principal});save();close();render();return toast('납부를 반영했어요');}
  if(e.target.closest('[data-save-new-debt]')){const name=document.querySelector('#dn').value.trim(),principal=Number(document.querySelector('#dp').value);if(!name||!principal)return toast('이름과 원금을 입력해줘');S.debts.push({id:uid(),name,principal,rate:Number(document.querySelector('#dr').value)||0,payment:Number(document.querySelector('#dpm').value)||0,due:Number(document.querySelector('#dd').value)||null,account:document.querySelector('#da').value||''});save();close();render();return toast('부채를 추가했어요');}
  if(e.target.closest('[data-save-asset]')){const name=document.querySelector('#an').value.trim();if(!name)return toast('자산 이름을 입력해줘');S.assets.push({id:uid(),name,value:Number(document.querySelector('#av').value)||0});save();close();render();return toast('자산을 추가했어요');}
  const sae=e.target.closest('[data-save-asset-edit]');if(sae){const x=S.assets.find(a=>a.id===sae.dataset.saveAssetEdit);if(!x)return;x.name=document.querySelector('#assetname').value.trim()||x.name;x.value=Number(document.querySelector('#assetvalue').value)||0;save();close();render();return toast('자산을 수정했어요');}
  if(e.target.closest('[data-save-new-account]')){const name=document.querySelector('#newaccname').value.trim();if(!name)return toast('계정 이름을 입력해줘');S.accounts.push({id:uid(),name,type:document.querySelector('#newacctype').value,openingBalance:Number(document.querySelector('#newaccbal').value)||0});save();close();render();return toast('계정을 추가했어요');}
  const sae2=e.target.closest('[data-save-account-edit]');if(sae2){const x=accountObj(sae2.dataset.saveAccountEdit);if(!x)return;const newType=document.querySelector('#accounttype').value;if(newType!==x.type && S.tx.some(t=>t.account===x.id||t.toAccount===x.id))return toast('거래 기록이 있는 계정은 종류를 바꿀 수 없어요');const current=accountBalance(x.id),desired=Number(document.querySelector('#accountbalance').value)||0,delta=desired-current;x.name=document.querySelector('#accountname').value.trim()||x.name;x.type=newType;if(delta)S.tx.push({id:uid(),date:TODAY,type:'adjustment',amount:Math.abs(delta),adjustment:delta,cat:'잔액 조정',account:x.id,note:'계정 현재 금액 수정'});save();close();render();return toast('계정을 수정했어요');}
  const scp=e.target.closest('[data-save-card-pay]');if(scp){const card=accountObj(scp.dataset.saveCardPay),amount=Number(document.querySelector('#cardpayamt').value),from=document.querySelector('#cardpayacc').value;if(!card||amount<=0)return toast('납부 금액을 입력해줘');if(amount>Math.max(0,accountBalance(card.id)))return toast('현재 미결제금보다 많이 납부할 수 없어요');S.tx.push({id:uid(),date:TODAY,type:'transfer',amount,cat:'카드대금 납부',account:from,toAccount:card.id,note:card.name});save();close();render();return toast('카드대금을 반영했어요');}
  if(e.target.closest('[data-save-profile]')){S.profile.name=document.querySelector('#pname').value.trim();S.profile.nickname=document.querySelector('#pnick').value.trim();S.profile.birthDate=document.querySelector('#pbirth').value;S.profile.appTitle=document.querySelector('#papptitle').value.trim()||'움직이자';delete S.profile.legacyAge;save();close();render();return toast('프로필을 수정했어요');}
  const sas=e.target.closest('[data-save-area]');if(sas){const a=S.areas.find(x=>x.id===sas.dataset.saveArea);if(!a)return;a.name=document.querySelector('#areaname').value.trim()||a.name;a.icon=document.querySelector('#areaicon').value.trim()||'●';a.color=document.querySelector('#areacolor').value||a.color;const linked=document.querySelector('#areaincome').checked;if(linked)S.areas.forEach(x=>x.incomeLinked=false);a.incomeLinked=linked;save();close();render();return areaManager();}
  const sru=e.target.closest('[data-save-routine]');if(sru){const name=document.querySelector('#routinename').value.trim();if(!name)return toast('루틴 이름을 입력해줘');const days=[...document.querySelectorAll('[data-routine-day].active')].map(x=>Number(x.dataset.routineDay));if(!days.length)return toast('반복 요일을 하나 이상 선택해줘');if(sru.dataset.saveRoutine==='new')S.routines.push({id:uid(),name,days,completions:{},active:true});else{const r=S.routines.find(x=>x.id===sru.dataset.saveRoutine);if(r){r.name=name;r.days=days;}}save();close();render();return toast('루틴을 저장했어요');}
  if(e.target.closest('[data-save-timer-setting]')){S.settings.focusMinutes=Math.max(1,Math.min(180,Number(document.querySelector('#focusminutes').value)||10));save();close();render();return toast('집중 시간을 저장했어요');}
  if(e.target.closest('[data-save-special-asset]')){S.specialAsset.enabled=document.querySelector('#specialenabled').checked;S.specialAsset.label=document.querySelector('#speciallabel').value.trim()||'장기 자산';S.specialAsset.value=Number(document.querySelector('#specialvalue').value)||0;S.specialAsset.goal=Number(document.querySelector('#specialgoal').value)||0;save();close();render();return toast('자산 목표를 저장했어요');}
  if(e.target.closest('[data-save-review-prompts]')){const read=type=>[...document.querySelectorAll(`[data-review-prompt-row][data-type="${type}"]`)].map(r=>({key:r.dataset.key||`rp_${uid()}`,label:r.querySelector('.review-prompt-input').value.trim()})).filter(p=>p.label);S.reviewPrompts.weekly=read('weekly');S.reviewPrompts.monthly=read('monthly');save();close();render();return toast('리뷰 질문을 저장했어요');}
  if(e.target.closest('[data-save-decision-prompts]')){S.decisionPrompts=[...document.querySelectorAll('[data-decision-prompt-row]')].map(r=>({key:r.dataset.key||`dp_${uid()}`,label:r.querySelector('.decision-prompt-input').value.trim(),kind:r.querySelector('.decision-prompt-kind').value})).filter(p=>p.label);save();close();render();return toast('결정 질문을 저장했어요');}
  if(e.target.closest('[data-save-principle]')){S.principle=document.querySelector('#principle').value.trim();save();close();render();return toast('원칙을 저장했어요');}
  if(e.target.closest('[data-save-promise]')){S.promise=document.querySelector('#promise').value.trim();S.promiseUpdatedAt=TODAY;S.tab='me';S.mePage='promise';save();close();render();return toast('약속을 수정했어요');}
});

function saveEvent(id){
  const title=document.querySelector('#evtitle').value.trim();if(!title)return toast('일정 제목을 입력해줘');
  const date=document.querySelector('#evdate').value,time=document.querySelector('#evtime').value,areaId=document.querySelector('#roles .active')?.dataset.areaVal||S.areas[0]?.id,core=document.querySelector('#evcore').checked;
  let ev=id?S.events.find(x=>x.id===id):{id:uid(),done:false};if(!ev)return;
  ev.date=date;ev.time=time;ev.title=title;ev.area=areaId;ev.core=core;
  const linked=ev.txid?S.tx.find(t=>t.id===ev.txid):null, isIncome=area(areaId).incomeLinked, amount=Number(document.querySelector('#evamt')?.value)||0;
  if(isIncome&&amount>0){const account=document.querySelector('#evacc')?.value,cat=document.querySelector('#evcat')?.value;if(account&&cat){if(linked){Object.assign(linked,{date,type:'income',amount,cat,account,note:title});delete linked.legacyNoAccountEffect;}else{const tx={id:uid(),date,type:'income',amount,cat,account,note:title};S.tx.push(tx);ev.txid=tx.id;}}}
  else if(linked){S.tx=S.tx.filter(t=>t.id!==linked.id);delete ev.txid;}
  if(!id)S.events.push(ev);save();close();render();toast(id?'일정을 수정했어요':ev.txid?'일정과 수익을 저장했어요':'일정을 저장했어요');
}
function saveTask(id){ const title=document.querySelector('#tasktitle').value.trim();if(!title)return toast('할 일을 입력해줘');let t=id?S.tasks.find(x=>x.id===id):{id:uid()};if(!t)return;const beforeDone=!!t.done;t.date=document.querySelector('#taskdate').value;t.title=title;t.area=document.querySelector('#taskroles .active')?.dataset.areaVal||S.areas[0]?.id;t.goal=document.querySelector('#taskgoal').value.trim();t.core=document.querySelector('#taskcore').checked;t.done=document.querySelector('#taskdone')?.checked||false;if(t.done&&t.core){t.coreCompleted=true;t.core=false;}if(!id)S.tasks.push(t);save();close();render();toast(id?'할 일을 수정했어요':'할 일을 저장했어요'); }
function saveDecision(id){ const ans={};document.querySelectorAll('.dec').forEach(x=>ans[x.dataset.key]=x.checked);const v=verdictFromAnswers(ans);if(id){const x=S.decisions.find(d=>d.id===id);if(!x)return;Object.assign(x,{title:document.querySelector('#dtitle').value.trim()||'새 결정',cost:Number(document.querySelector('#dcost').value)||0,fixed:Number(document.querySelector('#dfixed').value)||0,memo:document.querySelector('#dmemo').value,answers:ans,...v});save();return decisionDetail(id);}const sn=snapshot(),x={id:uid(),date:TODAY,title:document.querySelector('#dtitle').value.trim()||'새 결정',cost:Number(document.querySelector('#dcost').value)||0,fixed:Number(document.querySelector('#dfixed').value)||0,memo:document.querySelector('#dmemo').value,answers:ans,...v,...sn};S.decisions.push(x);save();return decisionDetail(x.id); }

/* =========================
   Delete / reorder / manager actions
   ========================= */
document.addEventListener('click',e=>{
  const de=e.target.closest('[data-delete-event]');if(de){const x=S.events.find(z=>z.id===de.dataset.deleteEvent);if(!x)return;if(!confirm(`“${x.title}” 일정을 삭제할까요?${x.txid?'\n연결된 수익 기록도 함께 삭제됩니다.':''}`))return;if(x.txid)S.tx=S.tx.filter(t=>t.id!==x.txid);S.events=S.events.filter(z=>z.id!==x.id);save();close();render();return toast('일정을 삭제했어요');}
  const dt=e.target.closest('[data-delete-task]');if(dt){const x=S.tasks.find(z=>z.id===dt.dataset.deleteTask);if(!x||!confirm(`“${x.title}” 할 일을 삭제할까요?`))return;S.tasks=S.tasks.filter(z=>z.id!==x.id);save();close();render();return toast('할 일을 삭제했어요');}
  const dtx=e.target.closest('[data-delete-tx]');if(dtx){const t=S.tx.find(x=>x.id===dtx.dataset.deleteTx);if(!t||!confirm('이 기록을 삭제할까요? 계정 금액도 자동으로 다시 계산됩니다.'))return;if(t.debtId&&t.principalPaid){const d=S.debts.find(x=>x.id===t.debtId);if(d)d.principal+=Number(t.principalPaid)||0;}S.events.forEach(ev=>{if(ev.txid===t.id)delete ev.txid;});S.tx=S.tx.filter(x=>x.id!==t.id);save();close();render();return toast('기록을 삭제했어요');}
  const dg=e.target.closest('[data-delete-goal]');if(dg){const g=S.goals.find(x=>x.id===dg.dataset.deleteGoal);if(!g||!confirm(`“${g.title}” 목표를 삭제할까요?`))return;S.goals=S.goals.filter(x=>x.id!==g.id);save();close();render();return toast('목표를 삭제했어요');}
  const da=e.target.closest('[data-delete-asset]');if(da){const a=S.assets.find(x=>x.id===da.dataset.deleteAsset);if(!a||!confirm(`“${a.name}” 자산을 삭제할까요?`))return;S.assets=S.assets.filter(x=>x.id!==a.id);save();close();render();return toast('자산을 삭제했어요');}
  const dd=e.target.closest('[data-delete-debt]');if(dd){const d=S.debts.find(x=>x.id===dd.dataset.deleteDebt);if(!d||!confirm(`“${d.name}” 부채를 삭제할까요?`))return;S.debts=S.debts.filter(x=>x.id!==d.id);save();close();render();return toast('부채를 삭제했어요');}
  const dac=e.target.closest('[data-delete-account]');if(dac){const id=dac.dataset.deleteAccount,a=accountObj(id);if(!a)return;const used=S.tx.some(t=>t.account===id||t.toAccount===id)||S.debts.some(d=>d.account===id);if(used)return toast('연결된 거래나 부채가 있어 삭제할 수 없어요');if(!confirm(`“${a.name}” 계정을 삭제할까요?`))return;S.accounts=S.accounts.filter(x=>x.id!==id);save();close();render();return toast('계정을 삭제했어요');}
  const dr=e.target.closest('[data-delete-review]');if(dr){const r=S.reviews.find(x=>x.id===dr.dataset.deleteReview);if(!r||!confirm('이 리뷰를 삭제할까요?'))return;S.reviews=S.reviews.filter(x=>x.id!==r.id);save();close();render();return toast('리뷰를 삭제했어요');}
  const ddec=e.target.closest('[data-delete-decision]');if(ddec){const d=S.decisions.find(x=>x.id===ddec.dataset.deleteDecision);if(!d||!confirm('이 결정 기록을 삭제할까요?'))return;S.decisions=S.decisions.filter(x=>x.id!==d.id);save();close();render();return toast('결정 기록을 삭제했어요');}
  const darea=e.target.closest('[data-delete-area]');if(darea){const id=darea.dataset.deleteArea,a=S.areas.find(x=>x.id===id);if(!a)return;if(S.areas.length<=1)return toast('영역은 최소 1개 필요해요');const fallback=S.areas.find(x=>x.id!==id);const count=S.events.filter(x=>x.area===id).length+S.tasks.filter(x=>x.area===id).length;const msg=count?`“${a.name}” 영역을 삭제하고 사용 중인 ${count}개 기록을 “${fallback.name}” 영역으로 옮길까요?`:`“${a.name}” 영역을 삭제할까요?`;if(!confirm(msg))return;S.events.forEach(x=>{if(x.area===id)x.area=fallback.id;});S.tasks.forEach(x=>{if(x.area===id)x.area=fallback.id;});S.areas=S.areas.filter(x=>x.id!==id);save();close();render();return areaManager();}
  const drt=e.target.closest('[data-delete-routine]');if(drt){const r=S.routines.find(x=>x.id===drt.dataset.deleteRoutine);if(!r||!confirm(`“${r.name}” 루틴과 완료 기록을 삭제할까요?`))return;S.routines=S.routines.filter(x=>x.id!==r.id);save();close();render();return routineManager();}
  const mr=e.target.closest('[data-manual-core-remove]');if(mr){S.manualCores=S.manualCores.filter(x=>x.id!==mr.dataset.manualCoreRemove);save();return coreManager(mr.dataset.date||S.selected||TODAY);}
  const ma=e.target.closest('[data-add-manual-core]');if(ma){const v=document.querySelector('#manualcore')?.value.trim();if(!v)return toast('핵심 내용을 입력해줘');S.manualCores.push({id:uid(),date:ma.dataset.addManualCore,title:v,done:false,createdAt:Date.now()});save();return coreManager(ma.dataset.addManualCore);}
  const am=e.target.closest('[data-add-milestone-row]');if(am){document.querySelector('#mslist').insertAdjacentHTML('beforeend',milestoneRow());return;}
  const rm=e.target.closest('[data-remove-milestone-row]');if(rm){rm.closest('[data-ms-row]')?.remove();return;}
  const mu=e.target.closest('[data-ms-up]');if(mu){const row=mu.closest('[data-ms-row]');if(row?.previousElementSibling)row.parentNode.insertBefore(row,row.previousElementSibling);return;}
  const md=e.target.closest('[data-ms-down]');if(md){const row=md.closest('[data-ms-row]');if(row?.nextElementSibling)row.parentNode.insertBefore(row.nextElementSibling,row);return;}
  const aa=e.target.closest('[data-add-area]');if(aa){const newArea={id:`area_${uid()}`,name:'새 영역',icon:'●',color:'#6b7280',incomeLinked:false};S.areas.push(newArea);save();return areaEdit(newArea.id);}
  const move=e.target.closest('[data-area-move]');if(move){moveInArray(S.areas,move.dataset.id,move.dataset.areaMove);save();return areaManager();}
  const addCat=e.target.closest('[data-add-cat]');if(addCat){const type=addCat.dataset.addCat,input=document.querySelector(`#new-${type}-cat`),v=input.value.trim(),arr=type==='income'?S.incomeCats:S.expenseCats;if(!v)return toast('카테고리 이름을 입력해줘');if(arr.includes(v))return toast('이미 있는 카테고리예요');arr.push(v);save();return categoryManager();}
  const ren=e.target.closest('[data-rename-cat]');if(ren){const type=ren.dataset.renameCat,old=ren.dataset.name,arr=type==='income'?S.incomeCats:S.expenseCats,next=prompt('새 카테고리 이름',old)?.trim();if(!next||next===old)return;const idx=arr.indexOf(old);if(idx>=0)arr[idx]=next;S.tx.filter(t=>t.type===type&&t.cat===old).forEach(t=>t.cat=next);save();return categoryManager();}
  const delCat=e.target.closest('[data-delete-cat]');if(delCat){const type=delCat.dataset.deleteCat,name=delCat.dataset.name,arr=type==='income'?S.incomeCats:S.expenseCats;if(arr.length<=1)return toast('카테고리는 최소 1개 필요해요');if(!confirm(`“${name}” 카테고리를 목록에서 삭제할까요?\n과거 거래의 분류명은 유지됩니다.`))return;const idx=arr.indexOf(name);if(idx>=0)arr.splice(idx,1);save();return categoryManager();}
  const cm=e.target.closest('[data-cat-move]');if(cm){const arr=cm.dataset.type==='income'?S.incomeCats:S.expenseCats,idx=arr.indexOf(cm.dataset.name),next=cm.dataset.catMove==='up'?idx-1:idx+1;if(idx>=0&&next>=0&&next<arr.length)[arr[idx],arr[next]]=[arr[next],arr[idx]];save();return categoryManager();}
  const arp=e.target.closest('[data-add-review-prompt]');if(arp){const type=arp.dataset.addReviewPrompt,box=document.querySelector(`#${type}-prompt-list`);box?.insertAdjacentHTML('beforeend',reviewPromptRow(type,{key:`rp_${uid()}`,label:''}));return;}
  const adp=e.target.closest('[data-add-decision-prompt]');if(adp){document.querySelector('#decision-prompt-list')?.insertAdjacentHTML('beforeend',decisionPromptRow({key:`dp_${uid()}`,label:'',kind:'core'}));return;}
  const rpr=e.target.closest('[data-remove-prompt-row]');if(rpr){rpr.closest('[data-review-prompt-row],[data-decision-prompt-row]')?.remove();return;}
  const rpm=e.target.closest('[data-prompt-move]');if(rpm){const row=rpm.closest('[data-review-prompt-row],[data-decision-prompt-row]');if(!row)return;if(rpm.dataset.promptMove==='up'&&row.previousElementSibling)row.parentNode.insertBefore(row,row.previousElementSibling);if(rpm.dataset.promptMove==='down'&&row.nextElementSibling)row.parentNode.insertBefore(row.nextElementSibling,row);return;}
  const ar=e.target.closest('[data-add-routine]');if(ar)return routineForm();
});
function moveInArray(arr,id,dir){const i=arr.findIndex(x=>x.id===id),j=dir==='up'?i-1:i+1;if(i>=0&&j>=0&&j<arr.length)[arr[i],arr[j]]=[arr[j],arr[i]];}

/* =========================
   Backup/import/reset
   ========================= */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-export-data]')){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`move-backup-${TODAY}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return toast('백업 파일을 만들었어요');}
  if(e.target.closest('[data-import-click]')){document.querySelector('#importfile')?.click();return;}
  if(e.target.closest('[data-reset-data]')){if(!confirm('정말 모든 데이터를 삭제할까요? 이 작업은 백업이 없으면 되돌릴 수 없습니다.'))return;if(!confirm('한 번 더 확인할게요. 전체 초기화를 진행할까요?'))return;localStorage.removeItem(K);S=blankSeed();close();render();return;}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='importfile')return;const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||typeof parsed!=='object')throw new Error('invalid');S=migrate(parsed,true);S.onboarded=true;save();close();render();toast('백업을 불러왔어요');}catch(err){toast('올바른 백업 파일이 아니에요');}};reader.readAsText(file);
});

/* =========================
   Startup / date rollover
   ========================= */
render();
setInterval(()=>refreshToday(false),60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshToday(false);});
window.addEventListener('focus',()=>refreshToday(false));
</script>
