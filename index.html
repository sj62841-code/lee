</script><script>document.querySelector('#nav').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){S.tab=b.dataset.tab;if(S.tab==='me')S.mePage='main';render()}};document.querySelector('#fab').onclick=()=>quick(TODAY);document.querySelector('#overlay').onclick=e=>{if(e.target.id==='overlay')close()};document.addEventListener('click',e=>{let mp=e.target.closest('[data-money-page]');if(mp){S.moneyPage=mp.dataset.moneyPage;save();return render()}let td=e.target.closest('[data-tx-detail]');if(td){let x=S.tx.find(z=>z.id===td.dataset.txDetail);if(x)return open(`<h2>${x.type==='income'?'수익':'지출'} 상세</h2><div class="card" style="margin:0 0 12px;padding:16px"><div class="kicker">${label(x.date)}</div><div class="cash ${x.type==='income'?'pos':'neg'}" style="font-size:30px">${x.type==='income'?'+':'-'}${won(x.amount)}</div></div><div class="item"><span>분류</span><b>${esc(x.cat)}</b></div><div class="item"><span>${x.type==='income'?'들어온 곳':'빠진 곳'}</span><b>${esc(acc(x.account))}</b></div><div class="item"><span>메모</span><b>${esc(x.note||'없음')}</b></div>`)}let tm=e.target.closest('[data-today-money]');if(tm)return todayMoneyDetail(TODAY,tm.dataset.todayMoney);let p=e.target.closest('.pill[data-val]');if(p){p.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));p.classList.add('active');if(p.parentElement.id==='roles')document.querySelector('#incomePanel').style.display=p.dataset.val==='수익'?'block':'none';return}let d=e.target.closest('.day[data-date]');if(d)return dayView(d.dataset.date);let mode=e.target.closest('[data-mode]');if(mode){S.calMode=mode.dataset.mode;return render()}let md=e.target.closest('[data-month]');if(md){let[y,m]=S.month.split('-').map(Number);m+=Number(md.dataset.month);if(m<1){m=12;y--}if(m>12){m=1;y++}S.month=`${y}-${pad(m)}`;return render()}let q=e.target.closest('[data-quick]');if(q){let date=document.querySelector('#qdate')?.value||TODAY;if(q.dataset.quick==='income'||q.dataset.quick==='expense')return txForm(q.dataset [data-act]');if(!a)return;let act=a.dataset.act;if(act==='goto-me'){S.tab='me';S.mePage='main';return render()}if(act==='promise-page'){S.tab='me';S.mePage='promise';save();return render()}if(act==='promise-back'){S.mePage='main';save();return render()}if(act==='quick-money')return open(`<h2>돈 추가</h2><button class="item" data-money-choice="income" data-date="${TODAY}"><span>＋ 수익</span><b>›</b></button><button class="item" data-money-choice="expense" data-date="${TODAY}"><span>− 지출</span><b>›</b></button>`);if(act==='focus')return focus();if(act==='core')return coreManager(TODAY);if(act==='core-date')return coreManager(a.dataset.date);if(act==='today-cal'){S.tab='calendar';S.selected=TODAY;return render()}if(act==='goal-add')return goalForm();if(act==='milestones')return milestoneEditor();if(act==='tx-history')return open(`<h2>거래내역</h2>${S.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="moneyline"><span>${label(x.date)} · ${esc(x.cat)}<div class="sub">${esc(acc(x.account))}</div></span><b class="${x.type==='income'?'pos':'neg'}">${x.type==='income'?'+':'-'}${won(x.amount)}</b></div>`).join('')}`);if(act==='weekly')return weekly();if(act==='monthly')return monthly();if(act==='review-history')return reviewHistory();if(act==='decision')return decision();if(act==='decision-history')return decisionHistory();if(act==='timer-start'){stopTimer();timer=setInterval(()=>{remain=Math.max(0,remain-1);timerText();if(remain<=0){stopTimer();toast('10분 집중 완료')}},1000);return}if(act==='timer-pause'){stopTimer();return}if(act==='timer-reset'){stopTimer();remain=600;return timerText()}if(act==='principle')return open(`<h2>내 원칙</h2><textarea id="principle" class="textarea">${esc(S.principle)}</textarea><button class="primary" data-save-principle>저장</button>`);if(act==='promise')return open(`<h2>나에게 한 약속</h2><textarea id="promise" class="textarea">${esc(S.promise)}</textarea><button class="primary" data-save-promise>저장</button>`);if(act==='free-edit')return open(` ess').value)||0));save();close();render();return toast('목표를 수정했어요')}let pay=e.target.closest('[data-debt-pay]');if(pay){let x=S.debts.find(d=>d.id===pay.dataset.debtPay);if(!x||!x.payment)return toast('월 납부액을 먼저 설정해줘');let interest=Math.min(x.payment,Math.round(x.principal*(x.rate||0)/100/12)),principal=Math.min(x.principal,Math.max(0,x.payment-interest));x.principal=Math.max(0,x.principal-principal);let a=S.accounts.find(z=>z.id===x.account);if(a&&a.type==='cash')a.balance-=principal+interest;S.tx.push({id:uid(),date:TODAY,type:'expense',amount:principal+interest,cat:'부채 상환',account:x.account,note:`${x.name} · 원금 ${won(principal)} / 이자 ${won(interest)}`});save();close();render();return toast('납부 반영')}let ds=e.target.closest('[data-debt-save]');if(ds){let x=S.debts.find(d=>d.id===ds.dataset.debtSave);x.name=document.querySelector('#edname').value||x.name;x.principal=Number(document.querySelector('#edprincipal').value)||0;x.rate=Number(document.querySelector('#edrate').value)||0;x.payment=Number(document.querySelector('#edpayment').value)||0;x.due=Number(document.querySelector('#eddue').value)||null;save();close();render();return toast('부채 수정')}if(e.target.closest('[data-save-new-debt]')){let n=document.querySelector('#dn').value,p=Number(document.querySelector('#dp').value);if(!n||!p)return toast('이름과 원금을 입력해줘');S.debts.push({id:uid(),name:n,principal:p,payment:Number(document.querySelector('#dpm').value)||0,due:Number(document.querySelector('#dd').value)||null,rate:0,account:'biz'});save();close();render();return toast('부채 추가')}if(e.target.closest('[data-save-asset]')){let n=document.querySelector('#an').value,v=Number(document.querySelector('#av').value);if(!n||!v)return toast('이름과 금액을 입력해줘');S.assets.push({id:uid(),name:n,value:v});save();close();render();return toast('자산 추가')}if(e.target.closest('[data-save-free]')){S.free=Number(document.querySelector('#free').value)||0;save();close();render();return toast('수정했어요')}if(e.target.closest('[data-save-principle]')){S.principle=document.querySelector('#principle').value;save();close();render();return}if(e.target.closest('[data-save-promise]')){S.promise=document.querySelector('#promise').value.trim();S.promiseUpdatedAt=TODAY;S.tab='me';S.mePage='promise';save();close();render();return toast('약속을 수정했어요')}});document.addEventListener('click',e=>{
  let dm=e.target.closest('[data-day-money-detail]');if(dm)return todayMoneyDetail(dm.dataset.date,dm.dataset.dayMoneyDetail);
  let mt=e.target.closest('[data-manual-toggle]');if(mt){let x=S.manualCores.find(z=>z.id===mt.dataset.manualToggle);if(x){x.done=true;save();render();toast('완료했어요')}return}
  let mr=e.target.closest('[data-manual-core-remove]');if(mr){S.manualCores=S.manualCores.filter(x=>x.id!==mr.dataset.manualCoreRemove);save();render();return coreManager(S.selected||TODAY)}
  let ma=e.target.closest('[data-add-manual-core]');if(ma){let v=document.querySelector('#manualcore')?.value.trim();if(!v)return toast('핵심 내용을 입력해줘');S.manualCores.push({id:uid(),date:ma.dataset.addManualCore,title:v,done:false,createdAt:Date.now()});save();render();return coreManager(ma.dataset.addManualCore)}
  let maRow=e.target.closest('[data-add-milestone-row]');if(maRow){let anchor=document.querySelector('#milestone-add-anchor'),i=document.querySelectorAll('[data-ms-row]').length;if(anchor)anchor.insertAdjacentHTML('beforebegin',milestoneRow({age:'',title:'',sub:''},i));return}
  let mrRow=e.target.closest('[data-remove-milestone-row]');if(mrRow){mrRow.closest('[data-ms-row]')?.remove();return}
  let as=e.target.closest('[data-asset]');if(as)return assetDetail(as.dataset.asset);
  let ase=e.target.closest('[data-asset-edit]');if(ase)return assetEdit(ase.dataset.assetEdit);
  let ac=e.target.closest('[data-account-asset]');if(ac)return accountAssetDetail(ac.dataset.accountAsset);
  let ace=e.target.closest('[data-account-asset-edit]');if(ace)return accountAssetEdit(ace.dataset.accountAssetEdit);
  let sa=e.target.closest('[data-save-asset-edit]');if(sa){let x=S.assets.find(a=>a.id===sa.dataset.saveAssetEdit);if(!x)return;x.name=document.querySelector('#assetname').value.trim()||x.name;x.value=Number(document.querySelector('#assetvalue').value)||0;save();close();render();return toast('자산을 수정했어요')}
  let sac=e.target.closest('[data-save-account-asset-edit]');if(sac){let x=S.accounts.find(a=>a.id===sac.dataset.saveAccountAssetEdit);if(!x)return;x.name=document.querySelector('#accountname').value.trim()||x.name;x.balance=Number(document.querySelector('#accountbalance').value)||0;save();close();render();return toast('현금 계정을 수정했어요')}
  if(e.target.closest('[data-save-milestones]')){let rows=[...document.querySelectorAll('[data-ms-row]')],next=rows.map((row,i)=>({age:row.querySelector('.msage').value.trim(),title:row.querySelector('.mstitle').value.trim(),sub:row.querySelector('.mssub').value.trim()})).filter((x,i)=>i<4||x.age||x.title||x.sub);for(let i=0;i<Math.min(4,next.length);i++){next[i].age=next[i].age||S.milestones[i]?.age||`${25+i*5}세`;next[i].title=next[i].title||S.milestones[i]?.title||'목표';}S.milestones=next;save();close();render();return toast('미래 목표를 저장했어요')}
});
render();
</script></body></html>
