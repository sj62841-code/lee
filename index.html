function oldTxEffect(tx, account){
  if(!tx || !account || account.type!=='cash') return 0;
  if(tx.account!==account.id) return 0;
  if(tx.type==='income') return Number(tx.amount)||0;
  if(tx.type==='expense') return -(Number(tx.amount)||0);
  return 0;
}

function migrate(raw, fromImport=false){
  const incomingVersion = Number(raw?.version)||0;
  const hadLegacy = raw && typeof raw === 'object' && !raw.version;
  const base = blankSeed();
  const x = raw && typeof raw==='object' ? raw : base;

  // Existing pre-v16 users keep their existing personal prototype data.
  if(hadLegacy){
    x.onboarded = true;
    x.profile = x.profile || {name:'이승종', nickname:'승종', birthDate:'', appTitle:'승종아 움직이자', legacyAge:24};

function confirmedCash(){ return S.accounts.filter(a=>a.type==='cash').reduce((sum,a)=>sum+(a.confirmedBalance!=null?Number(a.confirmedBalance)||0:accountBalance(a.id)),0); }
function latestConfirmedAt(){ const vals=S.accounts.filter(a=>a.type==='cash'&&a.confirmedAt).map(a=>a.confirmedAt).sort(); return vals.length?vals[vals.length-1]:''; }
function formatDateTimeShort(v){ if(!v)return '직접 확인 전'; const d=parseLocalDateTime(v)||new Date(v); if(Number.isNaN(d.getTime()))return String(v); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function plannedExpenseTx(start,end){ return S.tx.filter(t=>t.type==='expense'&&!t.cancelled&&txIsPlanned(t)&&(!start||t.date>=start)&&(!end||t.date<=end)); }

function projectedExpenseTotal(start,end){ return S.tx.filter(t=>t.type==='expense'&&!t.cancelled&&(!start||t.date>=start)&&(!end||t.date<=end)).reduce((sum,t)=>sum+(Number(t.amount)||0),0); }
function projectedCashToMonthEnd(start,end){ return cash()+plannedIncomeTotal(start,end)-plannedCashExpenseTotal(start,end); }
function staleInfo(updatedAt,days=30){ if(!updatedAt)return {stale:true,label:'업데이트 필요'}; const d=parseLocalDateTime(updatedAt)||new Date(updatedAt); if(Number.isNaN(d.getTime()))return {stale:true,label:'업데이트 필요'}; const age=Math.floor((NOW-d)/86400000); return {stale:age>=days,label:age<=0?'오늘 업데이트':age<30?`${age}일 전`:`${age}일 전`}; }

function sum(type,start,end){ return S.tx.filter(t=>t.type===type && txIsEffective(t) && (!start||t.date>=start) && (!end||t.date<=end)).reduce((s,t)=>s+(Number(t.amount)||0),0); }
function incomeRuleKindLabel(kind){ return ({tax:'세금',share:'배분',saving:'저축',fee:'수수료',other:'기타'})[kind]||'기타'; }
function activeIncomeRules(){ return (S.incomeRules||[]).filter(r=>r.enabled!==false && Number(r.rate)>0); }
function incomeRuleAppliesToTx(rule,t){ return !!(rule&&t&&t.type==='income'&&(rule.cat==='all'||rule.cat===t.cat)); }
function incomeRulesForTx(t){ return activeIncomeRules().filter(r=>incomeRuleAppliesToTx(r,t)); }
function incomeRuleAmountForTx(rule,t){ return Math.round((Number(t?.amount)||0)*(Number(rule?.rate)||0)/100); }
function incomeRuleBase(rule,start,end){
  return S.tx.filter(t=>t.type==='income'&&txIsEffective(t)&&(!start||t.date>=start)&&(!end||t.date<=end)&&incomeRuleAppliesToTx(rule,t)).reduce((s,t)=>s+(Number(t.amount)||0),0);
}
function incomeRuleAmount(rule,start,end){ return S.tx.filter(t=>t.type==='income'&&txIsEffective(t)&&(!start||t.date>=start)&&(!end||t.date<=end)&&incomeRuleAppliesToTx(rule,t)).reduce((sum,t)=>sum+incomeRuleAmountForTx(rule,t),0); }
function incomeRuleSummary(start,end){
  const rules=activeIncomeRules().map(r=>({...r,base:incomeRuleBase(r,start,end),amount:incomeRuleAmount(r,start,end)}));

}
function projectedIncomeTx(start,end){

}

}

    return {...r,base,amount};
  });
  return {rules,total:rules.reduce((sum,r)=>sum+r.amount,0)};
}

}

function recurringOccurrenceDates(rule,fromDate=TODAY,days=370){
  const start=new Date(`${fromDate}T00:00:00`), limit=new Date(start);limit.setDate(limit.getDate()+days);
  const ruleStart=new Date(`${rule.startDate||fromDate}T00:00:00`); if(ruleStart>start)start.setTime(ruleStart.getTime());
  const out=[]; let d=new Date(start),guard=0;
  while(d<=limit&&guard++<500){
    const date=iso(d); let hit=false;
    if(rule.frequency==='daily')hit=true;
    else if(rule.frequency==='weekly')hit=d.getDay()===Number(rule.dayOfWeek||0);
    else { const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),target=Math.min(last,Math.max(1,Number(rule.dayOfMonth)||1)); hit=d.getDate()===target; }
    if(hit)out.push(date); d.setDate(d.getDate()+1);
  }
  return out;
}
function removeFutureRecurringTx(ruleId){ S.tx=S.tx.filter(t=>!(t.recurringExpenseId===ruleId&&txIsPlanned(t))); }
function syncRecurringExpenses(){
  if(!Array.isArray(S.recurringExpenses))S.recurringExpenses=[];
  S.recurringExpenses.filter(r=>r.active!==false&&r.amount>0&&accountObj(r.account)?.active!==false).forEach(r=>{
    recurringOccurrenceDates(r,TODAY,r.frequency==='daily'?62:r.frequency==='weekly'?190:370).forEach(date=>{
      const scheduledAt=`${date}T${r.time||'09:00'}:00`;
      let t=S.tx.find(x=>x.recurringExpenseId===r.id&&x.scheduledAt===scheduledAt);
      if(!t){S.tx.push({id:uid(),date,type:'expense',amount:Number(r.amount)||0,cat:r.cat,account:r.account,note:r.name,scheduledAt,recurringExpenseId:r.id,autoRecurring:true});}
      else if(txIsPlanned(t)){Object.assign(t,{date,type:'expense',amount:Number(r.amount)||0,cat:r.cat,account:r.account,note:r.name,scheduledAt,cancelled:false});}
    });
  });
}
function recurringFrequencyLabel(r){return r.frequency==='daily'?'매일':r.frequency==='weekly'?`매주 ${['일','월','화','수','목','금','토'][Number(r.dayOfWeek)||0]}요일`:`매월 ${r.dayOfMonth||1}일`;}
function nextRecurringTx(ruleId){return S.tx.filter(t=>t.recurringExpenseId===ruleId&&txIsPlanned(t)).sort((a,b)=>(a.scheduledAt||'').localeCompare(b.scheduledAt||''))[0]||null;}

function monthRange(m){ const [y,mo]=m.split('-').map(Number),last=new Date(y,mo,0).getDate(); return [`${y}-${pad(mo)}-01`,`${y}-${pad(mo)}-${pad(last)}`]; }
function weekRange(date=TODAY){ const d=new Date(date+'T00:00:00'),n=(d.getDay()+6)%7,s=new Date(d);s.setDate(d.getDate()-n);const e=new Date(s);e.setDate(s.getDate()+6);return [iso(s),iso(e)]; }
function label(date){ if(!date)return '-'; const [y,m,d]=date.split('-').map(Number),x=new Date(y,m-1,d);return `${m}월 ${d}일 ${['일','월','화','수','목','금','토'][x.getDay()]}요일`; }
function ageNow(){
  const b=S.profile.birthDate;
  if(!b) return S.profile.legacyAge ? `${S.profile.legacyAge}세` : '나이 설정 필요';
  const bd=new Date(b+'T00:00:00'); if(Number.isNaN(bd.getTime()))return '나이 설정 필요';
  let age=NOW.getFullYear()-bd.getFullYear();
  const hadBirthday = (NOW.getMonth()>bd.getMonth()) || (NOW.getMonth()===bd.getMonth() && NOW.getDate()>=bd.getDate());
  if(!hadBirthday)age--;
  return `${Math.max(0,age)}세`;
}
function initials(){
  const v=(S.profile.nickname||S.profile.name||'ME').trim();
  if(!v)return 'ME';
  if(/[가-힣]/.test(v)) return v.slice(-2).toUpperCase();
  return v.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
}
function topCat(type,s,e){ const m={}; S.tx.filter(t=>t.type===type&&txIsEffective(t)&&t.date>=s&&t.date<=e).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount); return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]||['없음',0]; }
function goalAverage(){
  const gs=activeGoals().filter(g=>g.kind!=='time');
  return gs.length?Math.round(gs.reduce((s,g)=>s+goalProgress(g),0)/gs.length):0;
}
function coreItems(date=TODAY){
  return [
    ...S.events.filter(x=>x.date===date&&x.core&&!x.done&&x.status!=='cancelled').map(x=>({...x,type:'event',time:x.time||''})),
    ...S.tasks.filter(x=>x.date===date&&x.core&&!x.done).map(x=>({...x,type:'task',time:''})),
    ...S.manualCores.filter(x=>x.date===date&&!x.done).map(x=>({...x,type:'manual',time:''}))
  ].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
}
function coreHistory(start,end){
  const e=S.events.filter(x=>x.date>=start&&x.date<=end&&x.status!=='cancelled'&&(x.core||x.coreCompleted));
  const t=S.tasks.filter(x=>x.date>=start&&x.date<=end&&(x.core||x.coreCompleted));
  const m=S.manualCores.filter(x=>x.date>=start&&x.date<=end);
  const total=e.length+t.length+m.length;
  const done=e.filter(x=>x.done||x.coreCompleted).length+t.filter(x=>x.done||x.coreCompleted).length+m.filter(x=>x.done).length;
  return {total,done,pct:total?Math.round(done/total*100):0};
}

function routineScheduled(r,date){ const d=new Date(date+'T00:00:00'); return r.active!==false && r.days.includes(d.getDay()); }
function routineDone(r,date){ return !!(r.completions&&r.completions[date]); }
function routineStreak(r){
  let d=new Date(TODAY+'T00:00:00'),streak=0,guard=0;
  if(routineScheduled(r,TODAY) && !routineDone(r,TODAY)) d.setDate(d.getDate()-1);
  while(guard++<370){ const date=iso(d); if(routineScheduled(r,date)){ if(routineDone(r,date))streak++; else break; } d.setDate(d.getDate()-1); }
  return streak;
}
function routineMonthRate(r){
  const [s]=monthRange(TODAY.slice(0,7)); let d=new Date(s+'T00:00:00'),end=new Date(TODAY+'T00:00:00'),total=0,done=0;

}

function ledgerMeta(t){
  const state=t.cancelled?'취소 · ':txIsPlanned(t)?'예정 · ':'';
  if(t.type==='transfer')return `${state}이체 · ${esc(acc(t.account))} → ${esc(acc(t.toAccount))}${t.note?' · '+esc(t.note):''}`;
  if(t.type==='adjustment')return `${state}잔액 조정 · ${esc(acc(t.account))}${t.note?' · '+esc(t.note):''}`;
  return `${state}${t.type==='income'?'수익':'지출'} · ${esc(acc(t.account))}${t.note?' · '+esc(t.note):''}`;
}
function txSigned(t){
  if(t.type==='income')return '+'+won(t.amount);
  if(t.type==='expense')return '-'+won(t.amount);
  if(t.type==='transfer')return won(t.amount);
  const n=Number(t.adjustment)||0;return `${n>=0?'+':''}${won(n)}`;
}
function txClass(t){ if(t.cancelled)return 'cancelled-text';if(t.type==='income')return 'pos';if(t.type==='expense')return 'neg';if(t.type==='adjustment')return (Number(t.adjustment)||0)>=0?'pos':'neg';return ''; }

  document.querySelector('#main').innerHTML=`${tabs}

function recurringExpenseForm(r=null){

>반복 지출 삭제</button>`:''}`);
}

document.querySelector('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;if(S.tab==='me')S.mePage='main';render();});
document.querySelector('#fab').addEventListener('click',()=>quick(TODAY));
document.querySelector('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')close();});

document.addEventListener('click',e=>{
  const undo=e.target.closest('[data-undo]');if(undo&&undoAction){const fn=undoAction;undoAction=null;fn();document.querySelector('#toast').classList.remove('show');return;}
  const mp=e.target.closest('[data-money-page]');if(mp){S.moneyPage=mp.dataset.moneyPage;return render();}
  const tm=e.target.closest('[data-today-money]');if(tm)return todayMoneyDetail(TODAY,tm.dataset.todayMoney);
  const dm=e.target.closest('[data-day-money-detail]');if(dm)return todayMoneyDetail(dm.dataset.date,dm.dataset.dayMoneyDetail);
  const td=e.target.closest('[data-tx-detail]');if(td)return txDetail(td.dataset.txDetail);
  const d=e.target.closest('.day[data-date]');if(d)return dayView(d.dataset.date);
  const mode=e.target.closest('[data-mode]');if(mode){S.calMode=mode.dataset.mode;return render();}
  const md=e.target.closest('[data-month]');if(md){let[y,m]=S.month.split('-').map(Number);m+=Number(md.dataset.month);if(m<1){m=12;y--;}if(m>12){m=1;y++;}S.month=`${y}-${pad(m)}`;return render();}
  const q=e.target.closest('[data-quick]');if(q){const date=document.querySelector('#qdate')?.value||TODAY;if(['income','expense'].includes(q.dataset.quick))return txForm(q.dataset.quick,date);if(q.dataset.quick==='event')return eventForm(date);return taskForm(date);}
  const da=e.target.closest('[data-day-add]');if(da){if(da.dataset.dayAdd==='event')return eventForm(da.dataset.date);if(da.dataset.dayAdd==='task')return taskForm(da.dataset.date);return open(`<h2>${label(da.dataset.date)} 돈 추가</h2><button class="item" data-money-choice="income" data-date="${da.dataset.date}">수익 <b>›</b></button><button class="item" data-money-choice="expense" data-date="${da.dataset.date}">지출 <b>›</b></button>`);}
  const mc=e.target.closest('[data-money-choice]');if(mc)return txForm(mc.dataset.moneyChoice,mc.dataset.date);
  const cat=e.target.closest('[data-cat-val]');if(cat){cat.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));cat.classList.add('active');return;}
  const ap=e.target.closest('[data-acc-val]');if(ap){ap.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));ap.classList.add('active');return;}
  const ar=e.target.closest('[data-area-val]');if(ar){ar.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));ar.classList.add('active');if(ar.parentElement.id==='roles'){const panel=document.querySelector('#incomePanel');if(panel)panel.style.display=area(ar.dataset.areaVal).incomeLinked?'block':'none';}if(ar.parentElement.id==='sroles'){const panel=document.querySelector('#sincomePanel');if(panel)panel.style.display=area(ar.dataset.areaVal).incomeLinked?'block':'none';}return;}
  const core=e.target.closest('[data-core]');if(core){const col=core.dataset.core==='event'?S.events:S.tasks,x=col.find(z=>z.id===core.dataset.id);if(x){x.core=!x.core;save();render();return coreManager(core.dataset.date);}return;}
  const tog=e.target.closest('[data-toggle]');if(tog){const col=tog.dataset.toggle==='event'?S.events:S.tasks,x=col.find(z=>z.id===tog.dataset.id);if(!x)return;const before={done:x.done,core:x.core,coreCompleted:x.coreCompleted};x.done=!x.done;if(x.done&&x.core){x.coreCompleted=true;x.core=false;}save();render();toast(x.done?'완료했어요':'완료를 취소했어요',()=>{Object.assign(x,before);save();render();});return;}
  const mt=e.target.closest('[data-manual-toggle]');if(mt){const x=S.manualCores.find(z=>z.id===mt.dataset.manualToggle);if(!x)return;x.done=true;save();render();toast('완료했어요',()=>{x.done=false;save();render();});return;}
  const rt=e.target.closest('[data-routine-toggle]');if(rt){const r=S.routines.find(x=>x.id===rt.dataset.routineToggle);if(!r)return;const before=!!r.completions[TODAY];r.completions[TODAY]=!before;if(!r.completions[TODAY])delete r.completions[TODAY];save();render();toast(r.completions[TODAY]?'루틴 완료':'완료 취소',()=>{if(before)r.completions[TODAY]=true;else delete r.completions[TODAY];save();render();});return;}
  const ec=e.target.closest('[data-event-cancel]');if(ec){const x=S.events.find(z=>z.id===ec.dataset.eventCancel);if(!x)return;const before=x.status||'scheduled',linked=x.txid?S.tx.find(t=>t.id===x.txid):null,txBefore=linked?!!linked.cancelled:false;x.status=before==='cancelled'?'scheduled':'cancelled';if(linked)linked.cancelled=x.status==='cancelled';if(x.status==='cancelled'){x.core=false;}save();render();toast(x.status==='cancelled'?'일정을 취소했어요':'다시 예정으로 바꿨어요',()=>{x.status=before;if(linked)linked.cancelled=txBefore;save();render();});return;}
  const taskD=e.target.closest('[data-task-detail]');if(taskD)return taskDetail(taskD.dataset.taskDetail);
  const ev=e.target.closest('[data-event]');if(ev)return eventDetail(ev.dataset.event);
  const ees=e.target.closest('[data-edit-event-series]');if(ees)return eventSeriesForm(ees.dataset.editEventSeries);
  const ets=e.target.closest('[data-edit-task-series]');if(ets)return taskSeriesForm(ets.dataset.editTaskSeries);
  const editEv=e.target.closest('[data-edit-event]');if(editEv)return eventForm(S.events.find(x=>x.id===editEv.dataset.editEvent)?.date||TODAY,S.events.find(x=>x.id===editEv.dataset.editEvent));
  const editTask=e.target.closest('[data-edit-task]');if(editTask){const t=S.tasks.find(x=>x.id===editTask.dataset.editTask);if(t)return taskForm(t.date,t);}
  const editTx=e.target.closest('[data-edit-tx]');if(editTx){const t=S.tx.find(x=>x.id===editTx.dataset.editTx);if(t)return txForm(t.type,t.date,t);}
  const db=e.target.closest('[data-debt]');if(db)return debtDetail(db.dataset.debt);
  const de=e.target.closest('[data-debt-edit]');if(de)return debtEdit(de.dataset.debtEdit);
  const as=e.target.closest('[data-asset]');if(as)return assetDetail(as.dataset.asset);
  const ase=e.target.closest('[data-asset-edit]');if(ase)return assetEdit(ase.dataset.assetEdit);
  const ac=e.target.closest('[data-account-asset]');if(ac)return accountDetail(ac.dataset.accountAsset);
  const ae=e.target.closest('[data-account-edit]');if(ae)return accountEdit(ae.dataset.accountEdit);
  const cp=e.target.closest('[data-card-pay]');if(cp)return cardPaymentForm(cp.dataset.cardPay);
  const gl=e.target.closest('[data-goal]');if(gl){const g=S.goals.find(x=>x.id===gl.dataset.goal);if(g)return goalForm(g);}
  const gar=e.target.closest('[data-goal-archive]');if(gar){const g=S.goals.find(x=>x.id===gar.dataset.goalArchive);if(!g)return;const was=g.status||'active';if(goalIsPast(g)){g.status='active';g.completed=false;delete g.archivedAt;if(g.kind==='time'){if(g.periodPreset==='custom'){g.startAt=localDateTimeValue(NOW);g.endAt=addGoalDuration(g.startAt,g.durationAmount||1,g.durationUnit||'days');}else{const b=periodBoundsForPreset(g.periodPreset||'this_month',NOW);g.startAt=b.startAt;g.endAt=b.endAt;}}}else{g.status='archived';g.archivedAt=Date.now();}save();close();render();return toast(g.status==='archived'?'목표를 보관했어요':'목표를 다시 진행해요',()=>{g.status=was;save();render();});}
  const agt=e.target.closest('[data-add-goal-task]');if(agt)return taskForm(TODAY,null,agt.dataset.addGoalTask);
  const mce=e.target.closest('[data-manual-core-edit]');if(mce){const x=S.manualCores.find(z=>z.id===mce.dataset.manualCoreEdit);if(x)return open(`<h2>핵심 수정</h2><input id="manualcoreedit" class="input" value="${esc(x.title)}"><button class="primary" data-save-manual-core="${x.id}" data-date="${mce.dataset.date||x.date}">저장</button>`);}
  const aa2=e.target.closest('[data-account-archive]');if(aa2){const x=accountObj(aa2.dataset.accountArchive);if(x){const archiving=x.active!==false;x.active=!archiving;if(archiving){S.recurringExpenses.filter(r=>r.account===x.id&&r.active!==false).forEach(r=>{r.active=false;removeFutureRecurringTx(r.id);});}save();return accountDetail(x.id);}}
  const rv=e.target.closest('[data-review]');if(rv)return reviewDetail(rv.dataset.review);
  const er=e.target.closest('[data-edit-review]');if(er){const r=S.reviews.find(x=>x.id===er.dataset.editReview);if(r)return r.type==='monthly'?monthly(r):weekly(r);}
  const dv=e.target.closest('[data-decision]');if(dv)return decisionDetail(dv.dataset.decision);
  const edv=e.target.closest('[data-edit-decision]');if(edv){const d=S.decisions.find(x=>x.id===edv.dataset.editDecision);if(d)return decision(d);}
  const era=e.target.closest('[data-edit-area]');if(era)return areaEdit(era.dataset.editArea);
  const rr=e.target.closest('[data-edit-routine]');if(rr){const r=S.routines.find(x=>x.id===rr.dataset.editRoutine);if(r)return routineForm(r);}
  const re=e.target.closest('[data-edit-recurring-expense]');if(re){const r=S.recurringExpenses.find(x=>x.id===re.dataset.editRecurringExpense);if(r)return recurringExpenseForm(r);}
  const qav=e.target.closest('[data-quick-asset-value]');if(qav){const x=S.assets.find(a=>a.id===qav.dataset.quickAssetValue);if(!x)return;const v=prompt('현재 가치',String(Math.round(x.value)))?.replace(/,/g,'');if(v==null)return;const n=Number(v);if(!Number.isFinite(n)||n<0)return toast('올바른 금액을 입력해줘');x.value=n;x.updatedAt=localDateTimeValue(NOW);save();close();render();return toast('자산 금액을 업데이트했어요');}
  const qdv=e.target.closest('[data-quick-debt-value]');if(qdv){const x=S.debts.find(d=>d.id===qdv.dataset.quickDebtValue);if(!x)return;const v=prompt('현재 남은 원금',String(Math.round(x.principal)))?.replace(/,/g,'');if(v==null)return;const n=Number(v);if(!Number.isFinite(n)||n<0)return toast('올바른 금액을 입력해줘');x.principal=n;x.updatedAt=localDateTimeValue(NOW);save();close();render();return toast('부채 원금을 업데이트했어요');}
  const irr=e.target.closest('[data-income-rule]');if(irr){const r=S.incomeRules.find(x=>x.id===irr.dataset.incomeRule);if(r)return incomeRuleForm(r);}
  if(e.target.closest('[data-add-income-rule]'))return incomeRuleForm();
  const rd=e.target.closest('[data-routine-day]');if(rd){rd.classList.toggle('active');return;}
  if(e.target.closest('[data-auth-device]')){const email=document.querySelector('#authemail')?.value.trim()||'';S.auth={...S.auth,status:'signed_in',provider:email?'email':'device',email,userId:S.auth.userId||`local_${uid()}`,tutorialSeen:false,tutorialStep:0};save();return render();}
  if(e.target.closest('[data-auth-existing]')){S.auth={...S.auth,status:'signed_in',provider:S.auth.provider||'device',userId:S.auth.userId||`device_${uid()}`,tutorialSeen:false,tutorialStep:0};save();return render();}
  if(e.target.closest('[data-auth-provider]'))return toast('실제 Google·Apple 로그인은 클라우드 연결 후 활성화할게요');
  const ta=e.target.closest('[data-tour-action]');if(ta)return runTourAction(Number(ta.dataset.tourAction)||0);
  const tp=e.target.closest('[data-tour-prev]');if(tp){const i=Math.max(0,(Number(tp.dataset.tourPrev)||0)-1);S.auth.tutorialStep=i;save();return guidedTutorialView(i);}
  const tn=e.target.closest('[data-tour-next]');if(tn){const i=Number(tn.dataset.tourNext)||0;if(i>=TOUR_STEPS.length-1)return finishTutorial();S.auth.tutorialStep=i+1;save();return guidedTutorialView(i+1);}
  if(e.target.closest('[data-tour-skip]'))return finishTutorial();
  if(e.target.closest('[data-bank-demo]'))return toast('오픈뱅킹 서버 연결 준비가 필요해요');

function saveEvent(id){
  const title=document.querySelector('#evtitle').value.trim();if(!title)return toast('일정 제목을 입력해줘');
  const date=document.querySelector('#evdate').value,time=document.querySelector('#evtime').value,areaId=document.querySelector('#roles .active')?.dataset.areaVal||S.areas[0]?.id,core=document.querySelector('#evcore').checked;
  const incomeRaw=document.querySelector('#evamt')?.value?.trim()||'',incomeAmount=incomeRaw===''?0:Number(incomeRaw);
  if(!Number.isFinite(incomeAmount)||incomeAmount<0)return toast('수익 금액은 0 이상으로 입력해줘');
  if(area(areaId).incomeLinked&&incomeAmount>0&&!time)return toast('수익 일정은 시간을 입력해줘');
  const repeat=id?'none':(document.querySelector('#evrepeat')?.value||'none'), dates=recurrenceDates(date,repeat), group=repeat!=='none'?uid():'';
  const saveOne=(targetDate,existing=null)=>{ let ev=existing||{id:uid(),done:false,status:'scheduled'}; ev.status=ev.status||'scheduled';ev.date=targetDate;ev.time=time;ev.title=title;ev.area=areaId;ev.core=ev.status==='cancelled'?false:core;ev.repeat=repeat; if(group)ev.recurrenceGroup=group;
    const linked=ev.txid?S.tx.find(t=>t.id===ev.txid):null,isIncome=area(areaId).incomeLinked,amount=incomeAmount;
    if(isIncome&&amount>0){const account=document.querySelector('#evacc')?.value,cat=document.querySelector('#evcat')?.value;if(account&&cat){const scheduledAt=`${targetDate}T${time}:00`;let txRef=linked;if(txRef){Object.assign(txRef,{date:targetDate,type:'income',amount,cat,account,note:title,eventId:ev.id,scheduledAt});delete txRef.legacyNoAccountEffect;}else{txRef={id:uid(),date:targetDate,type:'income',amount,cat,account,note:title,eventId:ev.id,scheduledAt};S.tx.push(txRef);ev.txid=txRef.id;}txRef.cancelled=ev.status==='cancelled';S.settings.lastEventIncome={cat,account};}} else if(linked){S.tx=S.tx.filter(t=>t.id!==linked.id);delete ev.txid;} return ev; };
  if(id){const ev=S.events.find(x=>x.id===id);if(!ev)return;saveOne(date,ev);} else {dates.forEach(d=>S.events.push(saveOne(d)));}
  save();close();render();toast(id?'일정을 수정했어요':repeat!=='none'?`${dates.length}개의 반복 일정을 만들었어요`:'일정을 저장했어요');
}

function saveGoalFromForm(id){

    else if(!(target>0))return toast('목표 금액을 입력해줘');
    const basisChanged=g.moneyBasis!==basis||g.moneyRefId!==ref;g.moneyBasis=basis;g.moneyRefId=ref;g.targetAmount=target;
    if(['debt','card'].includes(basis)&&(!id||basisChanged||!Number.isFinite(Number(g.startValue))))g.startValue=basis==='debt'?(Number(S.debts.find(d=>d.id===ref)?.principal)||0):Math.max(0,accountBalance(ref));else if(!['debt','card'].includes(basis))delete g.startValue;
    delete g.startAt;delete g.endAt;delete g.periodPreset;delete g.durationAmount;delete g.durationUnit;delete g.completed;
  }else if(kind==='tasks'){
    delete g.targetAmount;delete g.moneyBasis;delete g.moneyRefId;delete g.startValue;delete g.startAt;delete g.endAt;delete g.periodPreset;delete g.durationAmount;delete g.durationUnit;delete g.completed;
  }else{
    g.completed=!!document.querySelector('#gcompleted')?.checked;g.status=g.completed?'completed':(g.status==='completed'?'active':g.status);delete g.targetAmount;delete g.moneyBasis;delete g.moneyRefId;delete g.startValue;delete g.startAt;delete g.endAt;delete g.periodPreset;delete g.durationAmount;delete g.durationUnit;
  }
  if(!id)S.goals.push(g);save();close();render();return toast(id?'목표를 수정했어요':'목표를 저장했어요');
}

  const addCat=e.target.closest('[data-add-cat]');if(addCat){const type=addCat.dataset.addCat,input=document.querySelector(`#new-${type}-cat`),v=input.value.trim(),arr=type==='income'?S.incomeCats:S.expenseCats;if(!v)return toast('카테고리 이름을 입력해줘');if(arr.includes(v))return toast('이미 있는 카테고리예요');arr.push(v);save();return categoryManager();}
  const ren=e.target.closest('[data-rename-cat]');if(ren){const type=ren.dataset.renameCat,old=ren.dataset.name,arr=type==='income'?S.incomeCats:S.expenseCats,next=prompt('새 카테고리 이름',old)?.trim();if(!next||next===old)return;const idx=arr.indexOf(old);if(idx>=0)arr[idx]=next;S.tx.filter(t=>t.type===type&&t.cat===old).forEach(t=>t.cat=next);if(type==='income')S.incomeRules.filter(r=>r.cat===old).forEach(r=>r.cat=next);else S.recurringExpenses.filter(r=>r.cat===old).forEach(r=>r.cat=next);save();return categoryManager();}
  const delCat=e.target.closest('[data-delete-cat]');if(delCat){const type=delCat.dataset.deleteCat,name=delCat.dataset.name,arr=type==='income'?S.incomeCats:S.expenseCats;if(arr.length<=1)return toast('카테고리는 최소 1개 필요해요');if(!confirm(`“${name}” 카테고리를 목록에서 삭제할까요?\n과거 거래의 분류명은 유지됩니다.`))return;const idx=arr.indexOf(name);if(idx>=0)arr.splice(idx,1);if(type==='income')S.incomeRules.filter(r=>r.cat===name).forEach(r=>{r.enabled=false;});save();return categoryManager();}
  const cm=e.target.closest('[data-cat-move]');if(cm){const arr=cm.dataset.type==='income'?S.incomeCats:S.expenseCats,idx=arr.indexOf(cm.dataset.name),next=cm.dataset.catMove==='up'?idx-1:idx+1;if(idx>=0&&next>=0&&next<arr.length)[arr[idx],arr[next]]=[arr[next],arr[idx]];save();return categoryManager();}
  const arp=e.target.closest('[data-add-review-prompt]');if(arp){const type=arp.dataset.addReviewPrompt,box=document.querySelector(`#${type}-prompt-list`);box?.insertAdjacentHTML('beforeend',reviewPromptRow(type,{key:`rp_${uid()}`,label:''}));return;}
  const adp=e.target.closest('[data-add-decision-prompt]');if(adp){document.querySelector('#decision-prompt-list')?.insertAdjacentHTML('beforeend',decisionPromptRow({key:`dp_${uid()}`,label:'',kind:'core'}));return;}
  const rpr=e.target.closest('[data-remove-prompt-row]');if(rpr){rpr.closest('[data-review-prompt-row],[data-decision-prompt-row]')?.remove();return;}
  const rpm=e.target.closest('[data-prompt-move]');if(rpm){const row=rpm.closest('[data-review-prompt-row],[data-decision-prompt-row]');if(!row)return;if(rpm.dataset.promptMove==='up'&&row.previousElementSibling)row.parentNode.insertBefore(row,row.previousElementSibling);if(rpm.dataset.promptMove==='down'&&row.nextElementSibling)row.parentNode.insertBefore(row.nextElementSibling,row);return;}
  const are=e.target.closest('[data-add-recurring-expense]');if(are)return recurringExpenseForm();
  const ar=e.target.closest('[data-add-routine]');if(ar)return routineForm();
});
function moveInArray(arr,id,dir){const i=arr.findIndex(x=>x.id===id),j=dir==='up'?i-1:i+1;if(i>=0&&j>=0&&j<arr.length)[arr[i],arr[j]]=[arr[j],arr[i]];}

/* =========================
   Backup/import/reset
   ========================= */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-export-data]')){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`move-backup-${TODAY}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return toast('백업 파일을 만들었어요');}
  if(e.target.closest('[data-import-click]')){document.querySelector('#importfile')?.click();return;}
  if(e.target.closest('[data-reset-data]')){if(!confirm('정말 모든 데이터를 삭제할까요? 이 작업은 백업이 없으면 되돌릴 수 없습니다.'))return;if(!confirm('한 번 더 확인할게요. 전체 초기화를 진행할까요?'))return;localStorage.removeItem(K);S=blankSeed();close();render();return;}
});
document.addEventListener('input',e=>{if(e.target.id==='ledgersearch'){const q=e.target.value.trim().toLowerCase();document.querySelectorAll('[data-ledger-row]').forEach(r=>{r.style.display=!q||String(r.dataset.search||'').toLowerCase().includes(q)?'flex':'none';});return;}const bi=e.target.closest('[data-balance-input]');if(bi){const cur=Number(bi.dataset.current)||0,val=Number(bi.value)||0,d=val-cur,out=document.querySelector(`[data-balance-diff="${bi.dataset.balanceInput}"]`);if(out){out.textContent=Math.abs(d)<1?'차이 없음':`${d>0?'+':''}${won(d)}`;out.classList.toggle('pos',d>0);out.classList.toggle('neg',d<0);}}});
document.addEventListener('change',e=>{
  if(e.target.id==='gkind'){
    const k=e.target.value;['time','money','tasks','completion'].forEach(x=>{const el=document.querySelector(`#goal-${x}-panel`);if(el)el.style.display=x===k?'block':'none';});return;
  }
  if(e.target.id==='gperiod'){const el=document.querySelector('#goal-custom-period');if(el)el.style.display=e.target.value==='custom'?'block':'none';return;}
  if(e.target.id==='refreq'){const m=document.querySelector('#re-monthly'),w=document.querySelector('#re-weekly');if(m)m.style.display=e.target.value==='monthly'?'block':'none';if(w)w.style.display=e.target.value==='weekly'?'block':'none';return;}
  if(e.target.id==='gmoneybasis'){const basis=e.target.value,ref=document.querySelector('#goal-money-ref'),note=document.querySelector('#goal-money-note');if(ref){if(['account','card','asset','debt'].includes(basis)){const arr=basis==='account'?S.accounts.filter(a=>a.type==='cash'):basis==='card'?S.accounts.filter(a=>a.type==='card'):basis==='asset'?S.assets:S.debts;ref.style.display='block';ref.innerHTML=`<select id="gmoneyref" class="select">${arr.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`;}else{ref.style.display='none';ref.innerHTML='';}}if(note)note.textContent=['debt','card'].includes(basis)?'현재 금액에서 목표 금액까지 줄어든 비율을 자동 계산합니다.':'선택한 금액과 목표 금액을 자동 비교합니다.';return;}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='importfile')return;const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||typeof parsed!=='object')throw new Error('invalid');S=migrate(parsed,true);S.onboarded=true;save();close();render();toast('백업을 불러왔어요');}catch(err){toast('올바른 백업 파일이 아니에요');}};reader.readAsText(file);
});

/* =========================
   Startup / date rollover
   ========================= */
render();
setInterval(()=>refreshToday(false),60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshToday(false);});
window.addEventListener('focus',()=>refreshToday(false));
</script>
